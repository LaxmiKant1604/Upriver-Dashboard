name: fba-plan-golive
run-name: fba-plan-golive ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event.schedule }} ${{ inputs.dispatch_id }}

# TRUSTED FBA Shipment Plan refresh + publish workflow. It runs the SAME reviewed shadow-dispatcher /
# durable-OLI+Catalog derive / four-gate CAS publisher / safe-close architecture as scheduler-v2, in GitHub Actions
# where the production secrets live, and is DECOUPLED from scheduler-v2: fba-plan uses its OWN dedicated cycle
# namespace (us-fba / non-us-fba), so an FBA failure NEVER blocks Daily Reporting / Brand View, and the scheduler-v2
# OLI/Ads schedules are untouched.
#
# AUTOMATIC (schedule): once daily per bucket, AFTER the scheduler-v2 OLI refresh completes (fba-plan derives from
# the DURABLE Order Line Items history, which must be D-1 fresh; DataDoe's own FBA Inventory Health refresh is ~2am
# seller-local -- well before these times, and the binding constraint is durable-OLI freshness). scheduler-v2 OLI:
# non-us 02:00-03:00 UTC, us 10:30-11:30 UTC -> FBA follows, PRIMARY + a bounded FALLBACK ~1h later per bucket. The
# durable operation identity is the DEDICATED cycle (bucket-fba, as-of=D-1), so a fallback (or any replay) whose
# primary already finished is a ZERO-create idempotent no-op (skips the dispatch, publishes already-current).
#   - non-us @ 04:00 UTC (09:30 IST) primary, 05:00 UTC (10:30 IST) fallback
#   - us     @ 12:30 UTC (18:00 IST) primary, 13:30 UTC (19:00 IST) fallback
#
# MANUAL (workflow_dispatch) modes: preflight / dry-run-cost / golive-dry-run (all READ-ONLY, zero tokens) and golive.
#
# Required repository secrets (never printed): POSTGRES_URL, SUPABASE_URL (or VITE_SUPABASE_URL),
# SUPABASE_SERVICE_ROLE_KEY, DATADOE_API_KEY.

on:
  schedule:
    # Each cron maps DETERMINISTICALLY to exactly one bucket (resolved from github.event.schedule, never the clock).
    - cron: "0 4 * * *"    # Non-US PRIMARY  -- 04:00 UTC / 09:30 IST (after non-us OLI refresh)
    - cron: "0 5 * * *"    # Non-US FALLBACK -- 05:00 UTC / 10:30 IST
    - cron: "30 12 * * *"  # US PRIMARY      -- 12:30 UTC / 18:00 IST (after us OLI refresh)
    - cron: "30 13 * * *"  # US FALLBACK     -- 13:30 UTC / 19:00 IST
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation mode"
        required: true
        default: "golive-dry-run"
        type: choice
        options:
          - preflight
          - dry-run-cost
          - golive-dry-run
          - golive
      as_of:
        description: "Optional YYYY-MM-DD go-live as-of (blank = coverage-maximizing auto). Accounts short of it fail closed."
        required: false
        default: ""
      max_tokens:
        description: "Hard token ceiling for the go-live (refuses to start if the plan exceeds it)."
        required: false
        default: "80"
      dispatch_id:
        description: "Free-text run identity for the log (e.g. golive-2026-08-30)."
        required: false
        default: "manual"

concurrency:
  group: fba-plan-golive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: sales-dashboard-live
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATADOE_API_KEY: ${{ secrets.DATADOE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify required secrets are present (fail fast, never print values)
        run: |
          set -uo pipefail
          missing=""
          for v in POSTGRES_URL SUPABASE_SERVICE_ROLE_KEY DATADOE_API_KEY; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -z "${SUPABASE_URL:-}" ] && [ -z "${VITE_SUPABASE_URL:-}" ]; then missing="$missing SUPABASE_URL|VITE_SUPABASE_URL"; fi
          if [ -n "$missing" ]; then echo "STOP missing required repository secret(s):$missing" >&2; exit 1; fi
          echo "All required secrets present."

      - name: Install dependencies
        run: npm ci

      # ---------------- AUTOMATIC (schedule) ----------------
      - name: Resolve scheduled bucket + per-bucket token ceiling (deterministic from the cron, never the clock)
        id: sched
        if: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          case "${{ github.event.schedule }}" in
            "0 4 * * *")   bucket="non-us"; kind="primary";  maxtok=70 ;;
            "0 5 * * *")   bucket="non-us"; kind="fallback"; maxtok=70 ;;
            "30 12 * * *") bucket="us";     kind="primary";  maxtok=30 ;;
            "30 13 * * *") bucket="us";     kind="fallback"; maxtok=30 ;;
            *) echo "Unknown cron '${{ github.event.schedule }}' -- refusing (fail closed)." >&2; exit 1 ;;
          esac
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "maxtok=$maxtok" >> "$GITHUB_OUTPUT"
          {
            echo "### fba-plan scheduled refresh";
            echo "- cron: \`${{ github.event.schedule }}\` -> bucket: **$bucket** ($kind); per-bucket token ceiling: $maxtok";
            echo "- head SHA: \`${{ github.sha }}\` -> run id: ${{ github.run_id }} (attempt ${{ github.run_attempt }})";
            echo "- durable operation identity: dedicated cycle (\`$bucket-fba\`, as-of=D-1) -> a fallback whose primary already finished is a zero-create idempotent no-op.";
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Scheduled fba-plan refresh: cron='${{ github.event.schedule }}' bucket=$bucket kind=$kind maxtok=$maxtok sha=${{ github.sha }}"

      - name: FBA scheduled refresh (this bucket only; batched fetch -> derive -> publish -> ownership -> ALWAYS safe-close)
        if: ${{ github.event_name == 'schedule' }}
        env:
          PRIORITY_OPERATOR: laxmikant@superboring.in
        run: node scripts/release/fba-plan-golive.mjs --mode=go-live --bucket=${{ steps.sched.outputs.bucket }} --max-tokens=${{ steps.sched.outputs.maxtok }}

      # ---------------- MANUAL (workflow_dispatch) ----------------
      - name: FBA source preflight (READ ONLY -- balance + source column metadata; zero tokens)
        if: ${{ inputs.mode == 'preflight' }}
        run: node scripts/release/fba-source-preflight.mjs

      - name: FBA go-live cost dry-run (READ ONLY -- planned exports vs adoptable cache; zero tokens)
        if: ${{ inputs.mode == 'dry-run-cost' }}
        run: node scripts/release/fba-golive-dryrun.mjs

      - name: FBA go-live DRY-RUN (READ ONLY -- coverage-max as-of + batched plan + token cost; ZERO creates/controls)
        if: ${{ inputs.mode == 'golive-dry-run' }}
        env:
          PRIORITY_OPERATOR: laxmikant@superboring.in
        run: node scripts/release/fba-plan-golive.mjs --mode=dry-run ${{ inputs.as_of != '' && format('--as-of={0}', inputs.as_of) || '' }}

      - name: FBA GO-LIVE (bounded refresh + derive + publish + always-safe-close; hard token ceiling)
        if: ${{ inputs.mode == 'golive' }}
        env:
          PRIORITY_OPERATOR: laxmikant@superboring.in
        run: node scripts/release/fba-plan-golive.mjs --mode=go-live --max-tokens=${{ inputs.max_tokens }} ${{ inputs.as_of != '' && format('--as-of={0}', inputs.as_of) || '' }}

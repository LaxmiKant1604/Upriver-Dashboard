name: fba-plan-golive
run-name: fba-plan-golive ${{ inputs.mode }} ${{ inputs.region }} ${{ inputs.dispatch_id }}

# TRUSTED FBA Shipment Plan refresh + publish operator -- MANUAL dry-run / go-live ONLY.
#
# It runs the SAME reviewed shadow-dispatcher / durable-OLI+Catalog derive / four-gate CAS publisher / safe-close
# architecture as scheduler-v2, in GitHub Actions where the production secrets live, and is DECOUPLED via its OWN
# dedicated cycle namespace (<scope>-fba), so an FBA failure NEVER blocks Daily Reporting / Brand View.
#
# AUTOMATIC FBA refresh is NO LONGER owned here: the scheduler-v2 regional coordinator runs FBA per region as an
# ISOLATED job (its own runner + own safe-close) after that region's OLI evidence is ready. This workflow therefore
# carries NO crons -- FBA can never be double-refreshed, and there is no wall-clock-inferred bucket. It remains the
# MANUAL surface for an operator-driven preflight / cost dry-run / go-live dry-run / bounded go-live, optionally
# scoped to one region (or the legacy us/non-us buckets for rollback).
#
# MANUAL (workflow_dispatch) modes: preflight / dry-run-cost / golive-dry-run (all READ-ONLY, zero tokens) and golive.
#
# Required repository secrets (never printed): POSTGRES_URL, SUPABASE_URL (or VITE_SUPABASE_URL),
# SUPABASE_SERVICE_ROLE_KEY, DATADOE_API_KEY.

on:
  # MANUAL-ONLY. Automatic FBA is owned by the scheduler-v2 regional coordinator's isolated fba job (ONE owner),
  # so this workflow no longer carries crons -- FBA can never be refreshed by two schedulers.
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation mode"
        required: true
        default: "golive-dry-run"
        type: choice
        options:
          - preflight
          - dry-run-cost
          - golive-dry-run
          - golive
      region:
        description: "Scope for golive / golive-dry-run: all | india | europe-au | us-ca (regions), or us | non-us (legacy rollback)."
        required: false
        default: "all"
      as_of:
        description: "Optional YYYY-MM-DD go-live as-of (blank = coverage-maximizing auto). Accounts short of it fail closed."
        required: false
        default: ""
      max_tokens:
        description: "Hard token ceiling for the go-live (refuses to start if the plan exceeds it)."
        required: false
        default: "80"
      dispatch_id:
        description: "Free-text run identity for the log (e.g. golive-2026-08-30)."
        required: false
        default: "manual"

concurrency:
  group: fba-plan-golive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: sales-dashboard-live
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATADOE_API_KEY: ${{ secrets.DATADOE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify required secrets are present (fail fast, never print values)
        run: |
          set -uo pipefail
          missing=""
          for v in POSTGRES_URL SUPABASE_SERVICE_ROLE_KEY DATADOE_API_KEY; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -z "${SUPABASE_URL:-}" ] && [ -z "${VITE_SUPABASE_URL:-}" ]; then missing="$missing SUPABASE_URL|VITE_SUPABASE_URL"; fi
          if [ -n "$missing" ]; then echo "STOP missing required repository secret(s):$missing" >&2; exit 1; fi
          echo "All required secrets present."

      - name: Install dependencies
        run: npm ci

      - name: Resolve the manual scope flag (region takes precedence; 'all' scopes all three regions)
        id: cfg
        run: |
          set -euo pipefail
          region="${{ inputs.region }}"
          if [ -z "$region" ]; then region="all"; fi
          case "$region" in
            all|india|europe-au|us-ca) scopeflag="--region=$region" ;;
            us|non-us)                 scopeflag="--bucket=$region" ;;
            *) echo "Invalid region '$region' (all|india|europe-au|us-ca|us|non-us)." >&2; exit 1 ;;
          esac
          echo "scopeflag=$scopeflag" >> "$GITHUB_OUTPUT"
          echo "Resolved manual scope flag: $scopeflag"

      # ---------------- MANUAL (workflow_dispatch) ----------------
      - name: FBA source preflight (READ ONLY -- balance + source column metadata; zero tokens)
        if: ${{ inputs.mode == 'preflight' }}
        run: node scripts/release/fba-source-preflight.mjs

      - name: FBA go-live cost dry-run (READ ONLY -- planned exports vs adoptable cache; zero tokens)
        if: ${{ inputs.mode == 'dry-run-cost' }}
        run: node scripts/release/fba-golive-dryrun.mjs

      - name: FBA go-live DRY-RUN (READ ONLY -- coverage-max as-of + batched plan + token cost; ZERO creates/controls)
        if: ${{ inputs.mode == 'golive-dry-run' }}
        env:
          PRIORITY_OPERATOR: laxmikant@superboring.in
        run: node scripts/release/fba-plan-golive.mjs --mode=dry-run ${{ steps.cfg.outputs.scopeflag }} ${{ inputs.as_of != '' && format('--as-of={0}', inputs.as_of) || '' }}

      - name: FBA GO-LIVE (bounded refresh + derive + publish + always-safe-close; hard token ceiling)
        if: ${{ inputs.mode == 'golive' }}
        env:
          PRIORITY_OPERATOR: laxmikant@superboring.in
        run: node scripts/release/fba-plan-golive.mjs --mode=go-live ${{ steps.cfg.outputs.scopeflag }} --max-tokens=${{ inputs.max_tokens }} ${{ inputs.as_of != '' && format('--as-of={0}', inputs.as_of) || '' }}

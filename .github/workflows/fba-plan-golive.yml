name: fba-plan-golive
run-name: fba-plan-golive ${{ inputs.mode }} ${{ inputs.dispatch_id }}

# TRUSTED, MANUAL-ONLY (workflow_dispatch) operator for the FIRST-TIME FBA Shipment Plan go-live. It runs the SAME
# reviewed source/derive/publish/safe-close architecture as scheduler-v2, in GitHub Actions where the production
# secrets live. It is NOT scheduled -- there is no cron here; the only automatic scheduler remains scheduler-v2, whose
# OLI/Ads times are untouched. Modes:
#   preflight  -- READ ONLY. Reads the DataDoe balance + GET /exports/sources column metadata for FBA Inventory Health
#                 + Listings. ZERO exports, ZERO tokens. Proves the credential path + batching feasibility.
# (Further modes -- source refresh, derive/publish, backfill -- are added only after preflight verifies feasibility.)
#
# Required repository secrets (never printed): POSTGRES_URL, SUPABASE_URL (or VITE_SUPABASE_URL),
# SUPABASE_SERVICE_ROLE_KEY, DATADOE_API_KEY.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation mode"
        required: true
        default: "golive-dry-run"
        type: choice
        options:
          - preflight
          - dry-run-cost
          - golive-dry-run
          - golive
      as_of:
        description: "Optional YYYY-MM-DD go-live as-of (blank = coverage-maximizing auto). Accounts short of it fail closed."
        required: false
        default: ""
      max_tokens:
        description: "Hard token ceiling for the go-live (refuses to start if the plan exceeds it)."
        required: false
        default: "80"
      dispatch_id:
        description: "Free-text run identity for the log (e.g. golive-2026-08-30)."
        required: false
        default: "manual"

concurrency:
  group: fba-plan-golive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: sales-dashboard-live
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATADOE_API_KEY: ${{ secrets.DATADOE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify required secrets are present (fail fast, never print values)
        run: |
          set -uo pipefail
          missing=""
          for v in POSTGRES_URL SUPABASE_SERVICE_ROLE_KEY DATADOE_API_KEY; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -z "${SUPABASE_URL:-}" ] && [ -z "${VITE_SUPABASE_URL:-}" ]; then missing="$missing SUPABASE_URL|VITE_SUPABASE_URL"; fi
          if [ -n "$missing" ]; then echo "STOP missing required repository secret(s):$missing" >&2; exit 1; fi
          echo "All required secrets present."

      - name: Install dependencies
        run: npm ci

      - name: FBA source preflight (READ ONLY -- balance + source column metadata; zero tokens)
        if: ${{ inputs.mode == 'preflight' }}
        run: node scripts/release/fba-source-preflight.mjs

      - name: FBA go-live cost dry-run (READ ONLY -- planned exports vs adoptable cache; zero tokens)
        if: ${{ inputs.mode == 'dry-run-cost' }}
        run: node scripts/release/fba-golive-dryrun.mjs

      - name: FBA go-live DRY-RUN (READ ONLY -- coverage-max as-of + batched plan + token cost; ZERO creates/controls)
        if: ${{ inputs.mode == 'golive-dry-run' }}
        env:
          PRIORITY_OPERATOR: laxmikant@superboring.in
        run: node scripts/release/fba-plan-golive.mjs --mode=dry-run ${{ inputs.as_of != '' && format('--as-of={0}', inputs.as_of) || '' }}

      - name: FBA GO-LIVE (bounded refresh + derive + publish + always-safe-close; hard token ceiling)
        if: ${{ inputs.mode == 'golive' }}
        env:
          PRIORITY_OPERATOR: laxmikant@superboring.in
        run: node scripts/release/fba-plan-golive.mjs --mode=go-live --max-tokens=${{ inputs.max_tokens }} ${{ inputs.as_of != '' && format('--as-of={0}', inputs.as_of) || '' }}

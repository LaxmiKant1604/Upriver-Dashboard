name: scheduler-v2
run-name: scheduler-v2 ${{ github.event_name == 'workflow_dispatch' && format('{0}/{1}', inputs.region, inputs.dispatch_id) || github.event.schedule }}

# TRUSTED regional refresh + publish coordinator for the whole active dashboard pipeline (Scheduler v2) -- the ONLY
# automatic scheduler (no pg_cron, no Vercel cron; the full source-refresh + derive + publish flow exceeds Vercel's
# 60s route cap). It is ALSO the ONE automatic owner of every paid source (OLI, Product Catalog reuse, Campaign Ads):
# campaign-ads-golive.yml carries no cron, so Campaign Ads can never be refreshed by two schedulers.
#
# THREE REGIONS publish INDEPENDENTLY -- none waits for nor blocks another, and none ever touches another's snapshots.
# Each cron maps DETERMINISTICALLY to exactly one region (resolved from github.event.schedule, NEVER the wall clock);
# accounts are discovered + routed every run by trusted stored marketplace evidence, so a newly connected seller
# auto-joins its region with no config change:
#   - india     @ 03:00 UTC (08:30 IST): IN accounts.                              Cloudflare watchdog 03:20 UTC.
#   - europe-au @ 08:30 UTC (14:00 IST): European marketplaces incl GB/UK + AU.    Cloudflare watchdog 08:50 UTC.
#   - us-ca     @ 16:30 UTC (22:00 IST): US + CA accounts.                          Cloudflare watchdog 16:50 UTC.
#
# Each region run: read-only duplicate guard (a delayed/repeated trigger -- e.g. the watchdog -- is a zero-write no-op
# once the exact D-1 is already live) -> cycle preflight -> token gate -> OLI refresh to D-1 -> Campaign Ads refresh
# (once, this region) -> HONEST effectivePublishAsOf (bounded 2-day tail; interior gap / lag>2 fail closed) -> open
# controls for ONLY this region -> Catalog reuse + derive + preflight + publish this region's accounts x3 + live
# read-back -> rebuild Brand View membership -> ALWAYS safe-close controls. FBA Shipment Plan runs as a SEPARATE,
# isolated job with its own per-account OLI-coverage resolver and safe-close. OLI, Campaign Ads and FBA each receive a
# bounded attempt after the shared guards; source failures cannot suppress one another or weaken publication gates.
#
# Insufficient tokens is a TYPED SAFE SKIP (SKIPPED_INSUFFICIENT_TOKENS). An UNREADABLE balance hard-fails. A
# same-date terminal cycle collision fails at the preflight before any token read. A region that cannot publish
# honestly fails closed at the readiness proof BEFORE any control is opened -- every other region stays untouched.
#
# Required repository secrets (never printed): POSTGRES_URL, SUPABASE_URL (or VITE_SUPABASE_URL),
# SUPABASE_SERVICE_ROLE_KEY, DATADOE_API_KEY (+ DATADOE_API_KEY_SECONDARY if a secondary connection is configured).

on:
  schedule:
    # Each cron maps DETERMINISTICALLY to exactly one region (resolved from github.event.schedule, never the clock).
    - cron: "0 3 * * *"    # india     PRIMARY -- 03:00 UTC / 08:30 IST
    - cron: "30 8 * * *"   # europe-au PRIMARY -- 08:30 UTC / 14:00 IST
    - cron: "30 16 * * *"  # us-ca     PRIMARY -- 16:30 UTC / 22:00 IST
  workflow_dispatch:
    inputs:
      region:
        description: "Region to run + publish (india | europe-au | us-ca). Publishes ONLY that region's accounts."
        required: true
        default: "india"
      refresh_mode:
        description: "normal | force-latest. force-latest makes a FRESH bounded DataDoe re-fetch of the still-missing D-1 window (bypasses stale cache). Scheduled events are ALWAYS normal."
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - force-latest
      dispatch_id:
        description: "External scheduler identity used by the Cloudflare watchdog (external/<region>/<D-1>); ordinary manual runs may keep 'manual'."
        required: false
        default: "manual"
      run_scope:
        description: "full (default: the whole region) | bootstrap (ONLY the region's atomically-claimed onboarding accounts, resolved from durable account_onboarding state in the backend -- account IDs are NEVER taken from inputs -- with sources gated by the enforced onboarding-wave budget; no publish, no v3). Scheduled events are ALWAYS full."
        required: false
        default: "full"
        type: choice
        options:
          - full
          - bootstrap

concurrency:
  # One in-flight run PER REGION (regions are independent); a re-dispatch of the same region queues behind its own run.
  # Resolve scheduled crons to the SAME region key used by workflow_dispatch. This prevents a delayed native cron
  # and its Cloudflare watchdog dispatch from running concurrently under different concurrency groups.
  group: scheduler-v2-${{ github.event_name == 'schedule' && (github.event.schedule == '0 3 * * *' && 'india' || github.event.schedule == '30 8 * * *' && 'europe-au' || github.event.schedule == '30 16 * * *' && 'us-ca' || 'unknown') || inputs.region }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: sales-dashboard-live
    outputs:
      region: ${{ steps.cfg.outputs.region }}
      asof: ${{ steps.cfg.outputs.asof }}
      # ONE shared inventory snapshot date (the previous UTC date, D-1) computed exactly once here and consumed
      # unchanged by BOTH the FBA job and the Listing Health v3 job, so FBA inventory and v3 always adopt a single
      # inventory identity (requested as EXACTLY [D-1 .. D-1]). It equals `asof` but stays a separate output so the
      # inventory identity is threaded explicitly. A watchdog re-dispatch for the same region+day recomputes the same value.
      inventory_asof: ${{ steps.cfg.outputs.inventory_asof }}
      run_required: ${{ steps.guard.outputs.run_required }}
      already_published: ${{ steps.guard.outputs.already_published }}
      token_proceed: ${{ steps.tokengate.outputs.proceed }}
      scope: ${{ steps.cfg.outputs.scope }}
      oli_ready: ${{ steps.guard.outputs.already_published == 'true' || steps.readiness.outputs.proceed == 'true' }}
      effective_asof: ${{ steps.readiness.outputs.effective_asof }}
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATADOE_API_KEY: ${{ secrets.DATADOE_API_KEY }}
      DATADOE_API_KEY_SECONDARY: ${{ secrets.DATADOE_API_KEY_SECONDARY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Secret validation MUST fail before any production I/O.
      - name: Verify required secrets are present (fail fast, never print values)
        run: |
          set -uo pipefail
          missing=""
          for v in POSTGRES_URL SUPABASE_SERVICE_ROLE_KEY DATADOE_API_KEY; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -z "${SUPABASE_URL:-}" ] && [ -z "${VITE_SUPABASE_URL:-}" ]; then missing="$missing SUPABASE_URL|VITE_SUPABASE_URL"; fi
          if [ -n "$missing" ]; then echo "STOP missing required repository secret(s):$missing" >&2; exit 1; fi
          echo "All required secrets present."

      - name: Resolve region + requestedAsOf (previous UTC date, = D-1) + refresh_mode + per-region token floor
        id: cfg
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Resolve the region from WHICH cron fired -- deterministic, never inferred from the wall clock.
            case "${{ github.event.schedule }}" in
              "0 3 * * *")   region="india"     ;;
              "30 8 * * *")  region="europe-au" ;;
              "30 16 * * *") region="us-ca"     ;;
              *) echo "Unknown cron '${{ github.event.schedule }}' -- refusing (fail closed)." >&2; exit 1 ;;
            esac
            # A SCHEDULED event is ALWAYS normal mode + FULL scope -- force-latest and the bootstrap scope
            # can be selected ONLY by workflow_dispatch.
            mode="normal"
            scope="full"
          else
            region="${{ github.event.inputs.region }}"
            mode="${{ github.event.inputs.refresh_mode }}"
            scope="${{ github.event.inputs.run_scope }}"
            if [ -z "$mode" ]; then mode="normal"; fi
            if [ -z "$scope" ]; then scope="full"; fi
          fi
          if [ "$region" != "india" ] && [ "$region" != "europe-au" ] && [ "$region" != "us-ca" ]; then echo "Invalid region '$region'." >&2; exit 1; fi
          if [ "$mode" != "normal" ] && [ "$mode" != "force-latest" ]; then echo "Invalid refresh_mode '$mode'." >&2; exit 1; fi
          if [ "$scope" != "full" ] && [ "$scope" != "bootstrap" ]; then echo "Invalid run_scope '$scope'." >&2; exit 1; fi
          # Per-region balance FLOOR for the token gate (worst-case dry-run: india ~10, europe-au ~16, us-ca ~8 tokens).
          case "$region" in
            "india")     tokenmin=10 ;;
            "europe-au") tokenmin=20 ;;
            "us-ca")     tokenmin=10 ;;
          esac
          asof="$(date -u -d 'yesterday' +%Y-%m-%d)"
          # ONE shared inventory snapshot date = the previous UTC date (D-1), computed EXACTLY ONCE here. FBA
          # inventory is requested as EXACTLY [D-1 .. D-1]; FBA + Listing Health v3 both adopt this single
          # identity, and the downstream v3 job must NEVER recompute it independently. It equals asof (both are
          # D-1) but stays a separate output so the inventory identity is always threaded explicitly. Matches
          # fbaInventoryAsOf() (previous UTC date) so the FBA inventory cache the v3 tranche reuses aligns.
          inventory_asof="$asof"
          # Durable operation identity is region + requestedAsOf (NOT the cron) so the primary + the watchdog share ONE
          # operation + one durable token/create budget (idempotent adoption).
          opkey="scheduled-fresh/$region/$asof"
          echo "region=$region" >> "$GITHUB_OUTPUT"
          echo "asof=$asof" >> "$GITHUB_OUTPUT"
          echo "inventory_asof=$inventory_asof" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "tokenmin=$tokenmin" >> "$GITHUB_OUTPUT"
          echo "opkey=$opkey" >> "$GITHUB_OUTPUT"
          {
            echo "### scheduler-v2 run (regional)";
            echo "- event: ${{ github.event_name }} · cron: \`${{ github.event.schedule }}\` · dispatch identity: \`${{ inputs.dispatch_id }}\`";
            echo "- resolved region: **$region** (publishes ONLY this region; every other region is untouched)";
            echo "- head/workflow SHA: \`${{ github.sha }}\` · run id: ${{ github.run_id }} (attempt ${{ github.run_attempt }})";
            echo "- requestedAsOf (D-1): $asof · inventoryAsOf (D-1, shared FBA+v3): $inventory_asof · refresh_mode: $mode · run_scope: $scope · operation key: \`$opkey\` · token floor: $tokenmin";
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Resolved event=${{ github.event_name }} cron='${{ github.event.schedule }}' region=$region requestedAsOf=$asof inventoryAsOf=$inventory_asof mode=$mode opkey=$opkey tokenmin=$tokenmin"

      - name: Install dependencies
        run: npm ci

      # BOOTSTRAP ack (running): the dispatched run's durable START receipt, keyed by the exact dispatch
      # identity + this workflow run's OWN token (github run_id-run_attempt). The ack STAMPS the token so
      # only THIS run may later ack completed/failed -- a superseded/expired run's late ack is a typed
      # stale-ack no-op. Full-scope + scheduled runs skip it; a manual run with no lease row is a green no-op.
      - name: Acknowledge bootstrap dispatch (running)
        if: steps.cfg.outputs.scope == 'bootstrap'
        run: node scripts/release/onboarding-dispatch-ack.mjs --region=${{ steps.cfg.outputs.region }} --dispatch-id=${{ inputs.dispatch_id }} --phase=running --run-token=${{ github.run_id }}-${{ github.run_attempt }}

      # Per-REGION whole-workflow duplicate guard. A delayed GitHub cron and the +20min Cloudflare watchdog can both
      # dispatch the same region D-1. Before cycle/token/control I/O, prove the exact current region-account x 3-report
      # live identities through the real storage-first frontend payload read-back. Complete => green no-op with ZERO
      # creates/writes/tokens. Incomplete => continue through the unchanged fail-closed pipeline.
      - name: Prove this region's D-1 is not already fully published (read-only duplicate guard)
        id: guard
        run: node scripts/release/verify-us-d1-published.mjs --bucket=${{ steps.cfg.outputs.region }} --requested-as-of=${{ steps.cfg.outputs.asof }} --account-scope=${{ steps.cfg.outputs.scope }}

      - name: Report already-published no-op
        if: steps.guard.outputs.already_published == 'true'
        run: echo "ALREADY_PUBLISHED_D1 -- exact live read-backs passed for ${{ steps.cfg.outputs.region }}; zero creates, zero controls, zero tokens."

      # (step 1) cycle-identity preflight: a same-date terminal collision fails EARLY, before any token read.
      - name: Cycle-identity preflight (this region)
        if: steps.guard.outputs.run_required == 'true'
        run: node scripts/release/scheduled-cycle-preflight.mjs --bucket=${{ steps.cfg.outputs.region }} --account-scope=${{ steps.cfg.outputs.scope }}

      # (step 2) Token gate: per-region balance floor. Unreadable balance hard-fails; insufficient tokens is a typed
      # safe skip (proceed=false) so every create/control step below is skipped.
      - name: Confirm token budget (per-region floor, before any create)
        id: tokengate
        if: steps.guard.outputs.run_required == 'true'
        run: node scripts/release/confirm-token-budget.mjs --min=${{ steps.cfg.outputs.tokenmin }} --bucket=${{ steps.cfg.outputs.region }}

      # (step 3) Refresh OLI to D-1 for THIS region (supersede a stale terminal cycle + auto-escalate a fresh fetch of
      # the still-missing <=5-seller batches, within the region's derived create/token ceiling). Record its raw outcome
      # instead of aborting the job so the independent Campaign Ads and FBA pipelines still get their own attempt.
      # In BOOTSTRAP scope, --dispatch-id binds every paid step to the IMMUTABLE (region, dispatch_id) wave
      # row (the account set + pinned dates come from there, never from --requested-as-of); it is ignored in
      # full scope. --requested-as-of stays for the natural path.
      - name: Refresh OLI to D-1 (supersede stale terminal cycle + auto-escalate fresh fetch)
        id: oli
        continue-on-error: true
        if: steps.guard.outputs.run_required == 'true' && steps.tokengate.outputs.proceed == 'true'
        run: node scripts/release/oli-refresh-d1.mjs --bucket=${{ steps.cfg.outputs.region }} --requested-as-of=${{ steps.cfg.outputs.asof }} --refresh-mode=${{ steps.cfg.outputs.mode }} --run-id=${{ github.run_id }} --account-scope=${{ steps.cfg.outputs.scope }} --dispatch-id=${{ inputs.dispatch_id }}

      # (step 4) Refresh CAMPAIGN Ads for THIS region ONCE (coverage mode, 21-day rolling window). Campaign is the ONLY
      # active Ads source and scheduler-v2 is its ONE automatic owner. Idempotent (already-covered => zero creates).
      # ASIN Ads exports are retired (a hard guard in ads-sync.js refuses them from every entry point). `always()` is
      # intentional: Campaign has its own compatibility preflight, <=5-seller recovery split and LKG isolation, so an
      # unrelated OLI failure must never suppress this source's bounded attempt.
      - name: Refresh Campaign Ads (this region only; coverage mode, 21-day rolling window)
        id: campaign
        continue-on-error: true
        if: always() && steps.guard.outputs.run_required == 'true' && steps.tokengate.outcome == 'success' && steps.tokengate.outputs.proceed == 'true'
        run: node scripts/release/scheduled-campaign-ads-refresh.mjs --bucket=${{ steps.cfg.outputs.region }} --as-of=${{ steps.cfg.outputs.asof }} --account-scope=${{ steps.cfg.outputs.scope }} --dispatch-id=${{ inputs.dispatch_id }}

      # (step 5, FULL scope only) STRICT D-1 readiness proof (read-only). Publication requires EVERY account gapless
      # through the EXACT requestedAsOf (D-1). A settlement tail, interior gap, blank provenance, or unreadable coverage
      # is a typed DATADOE_D1_NOT_READY: fail closed BEFORE any control is opened. BOOTSTRAP scope skips this -- the
      # scoped bootstrap publication proves readiness per account INSIDE its own derive/finalize (a not-ready account
      # yields no validated report job -> finalize refuses -> the publication fails -> the run acks 'failed').
      # OLI now emits a THREE-WAY publication outcome (steps.oli.outputs): full_complete / publishable / the exact
      # eligible (healthy, OLI-succeeded + D-1-covered) account ids + the deferred ids. A COMPLETE region proves + opens
      # + publishes WHOLE-region exactly as before; a PARTIAL-publishable region proves + publishes ONLY the healthy
      # subset (into a dedicated cycle), leaving the deferred accounts' dated LKG untouched; a FATAL / all-deferred OLI
      # exits nonzero (steps.oli.outcome != 'success') so nothing is opened or published.
      #
      # --eligible-accounts: on a PARTIAL, prove EXACTLY the healthy subset (so one deferred account does not fail-close
      # the whole region). On a COMPLETE region we pass a blank (a single space -> trimmed empty) so readiness is the
      # UNCHANGED whole-region proof (no happy-path behavior change). The `&& ' ' ||` sentinel is required because a
      # GitHub Actions ternary cannot yield an empty string directly.
      - name: Prove previous-day (D-1) readiness for this region (read-only; strict; healthy subset on a partial)
        id: readiness
        if: always() && steps.cfg.outputs.scope != 'bootstrap' && steps.guard.outputs.run_required == 'true' && steps.tokengate.outcome == 'success' && steps.tokengate.outputs.proceed == 'true' && steps.oli.outcome == 'success'
        run: node scripts/release/verify-bucket-readiness.mjs --bucket=${{ steps.cfg.outputs.region }} --requested-as-of=${{ steps.cfg.outputs.asof }} --account-scope=full --eligible-accounts=${{ steps.oli.outputs.full_complete == 'true' && ' ' || steps.oli.outputs.eligible_ids }}

      # PARTIAL-CYCLE SCHEMA CAPABILITY PREFLIGHT (READ-ONLY) -- runs BEFORE any publication control on a PARTIAL run.
      # A partial publishes the healthy subset into a dedicated priority-partial-<region>-<16hex> cycle, which the
      # production schema permits ONLY once migration 20260924 has widened the EXACT open_sync_cycle(text,date,
      # timestamptz,text) guard + the sync_cycles_bucket_check constraint. If that capability is missing OR unreadable,
      # this step exits nonzero BEFORE full_controls opens, so ZERO publication-control / lease / cycle / reservation /
      # publication writes occur (the earlier OLI/Campaign source refresh already ran independently; LKG preserved).
      # A COMPLETE region publishes into the natural cycle and does NOT need this (the step is skipped there).
      - name: Partial-cycle schema capability preflight (read-only; before controls; PARTIAL region only)
        id: partial_preflight
        if: steps.cfg.outputs.scope != 'bootstrap' && steps.guard.outputs.run_required == 'true' && steps.tokengate.outputs.proceed == 'true' && steps.oli.outcome == 'success' && steps.oli.outputs.full_complete != 'true' && steps.oli.outputs.publishable == 'true' && steps.readiness.outputs.proceed == 'true'
        run: node scripts/release/priority-partial-preflight.mjs --bucket=${{ steps.cfg.outputs.region }}

      # INDEPENDENT SALES PUBLICATION (Codex blocker 2): controls + BOTH publish paths are NO LONGER gated on
      # steps.campaign.outcome. Campaign Ads is an INDEPENDENT best-effort source (like the FBA job) with its own
      # compatibility preflight, <=5-seller recovery split and LKG isolation; its failure degrades the Daily ads band
      # to HONESTLY UNAVAILABLE / stale (never a fabricated zero -- the derive + publisher render adsAvailability
      # unavailable) and must NEVER block the OLI-driven sales dashboards (daily-reporting / brand-sales /
      # brand-inventory). A Campaign failure is surfaced by the non-failing notice below; the final honesty gate reddens
      # ONLY on the REQUIRED sales source (OLI). Safe-close fencing is unchanged.
      # (step 7, FULL scope) Open publication controls for this region x 3 keys (all_primary stays false).
      # Controls open when OLI + strict D-1 pass. On a PARTIAL run they ALSO require the partial-cycle capability
      # preflight to have SUCCEEDED (so a missing/unreadable capability opens NO controls); a COMPLETE run skips the
      # preflight and opens controls as before (byte-identical).
      - name: Open publication controls (this region only)
        id: full_controls
        if: steps.cfg.outputs.scope != 'bootstrap' && steps.guard.outputs.run_required == 'true' && steps.tokengate.outputs.proceed == 'true' && steps.oli.outcome == 'success' && steps.readiness.outputs.proceed == 'true' && (steps.oli.outputs.full_complete == 'true' || steps.partial_preflight.outcome == 'success')
        run: node scripts/release/priority-control-package.mjs --apply --bucket=${{ steps.cfg.outputs.region }} --account-scope=full --owner-token=${{ github.run_id }}-${{ github.run_attempt }}

      # (steps 6/8/9/10, FULL scope, COMPLETE region) Catalog reuse/refresh + derive + preflight EVERY account in this
      # region + publish this region x3 + live read-back into the NATURAL daily cycle. Runs ONLY when OLI covered the
      # WHOLE region (full_complete). Byte-identical to before. Reached ONLY after the strict D-1 proof.
      - name: Refresh Catalog + derive/preflight/publish this region at D-1 + live read-back (COMPLETE region)
        id: complete_publish
        if: steps.cfg.outputs.scope != 'bootstrap' && steps.guard.outputs.run_required == 'true' && steps.tokengate.outputs.proceed == 'true' && steps.oli.outcome == 'success' && steps.oli.outputs.full_complete == 'true' && steps.readiness.outputs.proceed == 'true'
        run: node scripts/release/priority-dashboards-release.mjs --bucket=${{ steps.cfg.outputs.region }} --as-of=${{ steps.readiness.outputs.effective_asof }} --operation-key=priority-dashboards/scheduled/${{ steps.cfg.outputs.asof }} --run-token=${{ github.run_id }}-${{ github.run_attempt }} --owner-generation=${{ steps.full_controls.outputs.generation }} --strict-d1

      # (steps 6/8/9/10, FULL scope, PARTIAL region -- Codex per-account isolation) Publish EXACTLY the healthy OLI-
      # eligible subset into a DEDICATED cycle (the entrypoint derives priority-partial-<region>-<membershipHash> from
      # the eligible ids), so the natural daily cycle is never finalized with a partial set and the deferred accounts'
      # dated LKG is untouched. Runs ONLY when OLI is publishable but NOT complete (some batch readiness/hard-deferred).
      # A fatal/all-deferred OLI already exited nonzero (oli.outcome != 'success') so neither publish step runs. Same
      # controls fence (--owner-generation) as the complete path; --strict-d1 still fails closed below D-1 per account.
      # The catalog --operation-key is the SAME per-day key the complete path uses (priority-dashboards/scheduled/<asof>):
      # the org-wide Catalog is ONE create per day, shared/adopted across the complete OR partial publish (mutually
      # exclusive per OLI outcome); a distinct "scheduled-partial/..." key is REJECTED by assertPriorityOperationKey.
      # The dedicated cycle isolation comes from the entrypoint-derived priority-partial-<region>-<hash> cycle bucket
      # (from --eligible-accounts), NOT from the operation key.
      - name: Publish the HEALTHY OLI-eligible subset at D-1 into a dedicated cycle + live read-back (PARTIAL region)
        id: partial_publish
        if: steps.cfg.outputs.scope != 'bootstrap' && steps.guard.outputs.run_required == 'true' && steps.tokengate.outputs.proceed == 'true' && steps.oli.outcome == 'success' && steps.oli.outputs.full_complete != 'true' && steps.oli.outputs.publishable == 'true' && steps.readiness.outputs.proceed == 'true' && steps.partial_preflight.outcome == 'success'
        run: node scripts/release/priority-dashboards-release.mjs --bucket=${{ steps.cfg.outputs.region }} --eligible-accounts=${{ steps.oli.outputs.eligible_ids }} --as-of=${{ steps.readiness.outputs.effective_asof }} --operation-key=priority-dashboards/scheduled/${{ steps.cfg.outputs.asof }} --run-token=${{ github.run_id }}-${{ github.run_attempt }} --owner-generation=${{ steps.full_controls.outputs.generation }} --strict-d1

      # Report the partial ONLY when the subset publish actually SUCCEEDED (never claim a publication on a failed step).
      - name: Report a PARTIAL publication (healthy subset published; deferred accounts keep dated LKG)
        if: always() && steps.cfg.outputs.scope != 'bootstrap' && steps.partial_publish.outcome == 'success'
        run: |
          echo "PARTIAL_PUBLICATION region=${{ steps.cfg.outputs.region }} eligible=${{ steps.oli.outputs.eligible_count }} deferred=${{ steps.oli.outputs.deferred_count }} -- the healthy accounts published fresh D-1; the deferred accounts keep their dated last-known-good and retry on the next natural cycle. NOT a complete-region publication."
          {
            echo "### D-1 publication (${{ steps.cfg.outputs.region }}): PARTIAL (healthy subset)";
            echo "- eligible (published fresh): ${{ steps.oli.outputs.eligible_count }} · deferred (kept dated LKG): ${{ steps.oli.outputs.deferred_count }}";
            echo "- deferred accounts retry on the next natural cycle; this is NOT a complete-region publication.";
          } >> "$GITHUB_STEP_SUMMARY"

      # (step 11, FULL scope) Rebuild + verify Brand View membership from ALL current brand-sales snapshots.
      - name: Rebuild + verify Brand View membership (this region's fresh + others' LKG; Supabase-only)
        if: steps.cfg.outputs.scope != 'bootstrap' && steps.guard.outputs.run_required == 'true' && steps.tokengate.outputs.proceed == 'true' && steps.oli.outcome == 'success' && steps.readiness.outputs.proceed == 'true'
        run: node scripts/release/rebuild-brand-membership.mjs

      # ===================== BOOTSTRAP scope: TRUE SCOPED PUBLICATION of EXACTLY the wave accounts ==============
      # (bootstrap step A) Open publication controls for EXACTLY the frozen dispatch-wave accounts (resolved from
      # the IMMUTABLE (region, dispatch_id) row -- never recomputed). No unrelated account enters the scope; an
      # empty ready set is a zero-write no-op.
      - name: (bootstrap) Open publication controls for EXACTLY the dispatch-wave accounts
        id: bootstrap_controls
        if: steps.cfg.outputs.scope == 'bootstrap' && steps.guard.outputs.run_required == 'true' && steps.tokengate.outputs.proceed == 'true' && steps.oli.outcome == 'success' && steps.campaign.outcome == 'success'
        run: node scripts/release/priority-control-package.mjs --apply --bucket=${{ steps.cfg.outputs.region }} --account-scope=bootstrap --dispatch-id=${{ inputs.dispatch_id }} --owner-token=${{ github.run_id }}-${{ github.run_attempt }}

      # (bootstrap step B) SCOPED publication: derive/finalize/publish/live-read-back EXACTLY the frozen wave
      # accounts over the DEDICATED bootstrap-<region> cycle -- no collision with the natural daily cycle, no
      # outside-wave account touched. A not-ready/missing account fails the derive/finalize (never a partial).
      - name: (bootstrap) Scoped publication of the dispatch-wave dashboards
        id: bootstrap_publish
        if: steps.cfg.outputs.scope == 'bootstrap' && steps.guard.outputs.run_required == 'true' && steps.tokengate.outputs.proceed == 'true' && steps.oli.outcome == 'success' && steps.campaign.outcome == 'success'
        run: node scripts/release/bootstrap-publish.mjs --region=${{ steps.cfg.outputs.region }} --dispatch-id=${{ inputs.dispatch_id }} --run-token=${{ github.run_id }}-${{ github.run_attempt }} --owner-generation=${{ steps.bootstrap_controls.outputs.generation }} --strict-d1

      # (bootstrap step C) Rebuild + verify Brand View membership (this region's fresh wave + others' LKG).
      - name: (bootstrap) Rebuild + verify Brand View membership (Supabase-only)
        if: steps.cfg.outputs.scope == 'bootstrap' && steps.guard.outputs.run_required == 'true' && steps.bootstrap_publish.outcome == 'success'
        run: node scripts/release/rebuild-brand-membership.mjs

      # (step 12) Safe-close publication controls -- ONLY when the matching --apply (full OR bootstrap) actually
      # succeeded and EMITTED a valid fencing generation. Round-10 (blocker 4): the safe-close is GATED on a
      # non-blank generation and passes the EXACT one, so it never runs with a blank/owner-only generation; if no
      # apply emitted a generation (apply skipped/failed), cleanup is honestly left for the lease TTL / --reclaim-stale.
      - name: Safe-close publication controls (only when apply emitted a generation)
        if: always() && steps.guard.outputs.run_required == 'true' && (steps.full_controls.outputs.generation != '' || steps.bootstrap_controls.outputs.generation != '')
        run: node scripts/release/priority-control-package.mjs --rollback --owner-token=${{ github.run_id }}-${{ github.run_attempt }} --owner-generation=${{ steps.full_controls.outputs.generation || steps.bootstrap_controls.outputs.generation }}

      - name: Report insufficient-tokens skip
        if: always() && steps.guard.outputs.run_required == 'true' && steps.tokengate.outputs.proceed != 'true' && steps.tokengate.outcome == 'success'
        run: echo "SKIPPED_INSUFFICIENT_TOKENS -- no creates, no controls, LKG unchanged (region=${{ steps.cfg.outputs.region }} requestedAsOf=${{ steps.cfg.outputs.asof }})."

      # Campaign Ads unavailable -- TWO accurate, mutually-exclusive notices (non-failing). "sales published" is claimed
      # ONLY when the APPLICABLE publication step -- INCLUDING its live read-back -- actually SUCCEEDED: the COMPLETE
      # step on a full_complete run, or the PARTIAL step otherwise (each publish entrypoint exits nonzero if its
      # read-back fails, so outcome=='success' proves publish+readback). Otherwise the second notice reports the
      # Campaign failure separately AND accurately states sales publication FAILED or was SKIPPED (never claims it
      # published). Ads stay honestly unavailable/stale (never a fabricated zero) either way; the run is already RED
      # (via the failed publish/readiness step) in the failed/skipped case.
      - name: Report Campaign Ads unavailable (sales PUBLISHED independently -- ads honestly unavailable)
        if: always() && steps.cfg.outputs.scope != 'bootstrap' && steps.guard.outputs.run_required == 'true' && steps.tokengate.outputs.proceed == 'true' && steps.oli.outcome == 'success' && steps.campaign.outcome != 'success' && ((steps.oli.outputs.full_complete == 'true' && steps.complete_publish.outcome == 'success') || (steps.oli.outputs.full_complete != 'true' && steps.partial_publish.outcome == 'success'))
        run: |
          echo "CAMPAIGN_ADS_UNAVAILABLE region=${{ steps.cfg.outputs.region }} campaign=${{ steps.campaign.outcome }} sales=published -- the OLI sales dashboards published independently (publish + read-back succeeded); the Ads band is HONESTLY UNAVAILABLE/stale (never a fabricated zero). Ads self-heal on the next natural cycle."
          echo "### Campaign Ads unavailable (${{ steps.cfg.outputs.region }}) -- sales PUBLISHED; ads band honestly unavailable/stale" >> "$GITHUB_STEP_SUMMARY"

      - name: Report Campaign Ads failure WITHOUT a sales publication (sales publication failed or skipped)
        if: always() && steps.cfg.outputs.scope != 'bootstrap' && steps.guard.outputs.run_required == 'true' && steps.tokengate.outputs.proceed == 'true' && steps.oli.outcome == 'success' && steps.campaign.outcome != 'success' && !((steps.oli.outputs.full_complete == 'true' && steps.complete_publish.outcome == 'success') || (steps.oli.outputs.full_complete != 'true' && steps.partial_publish.outcome == 'success'))
        run: |
          echo "CAMPAIGN_ADS_FAILED_NO_PUBLICATION region=${{ steps.cfg.outputs.region }} campaign=${{ steps.campaign.outcome }} complete_publish=${{ steps.complete_publish.outcome }} partial_publish=${{ steps.partial_publish.outcome }} -- Campaign Ads failed AND the SALES publication did NOT complete (failed or skipped: readiness/controls/capability/publish). NO dashboards were published this run; LKG preserved. This is NOT a sales publication." >&2
          echo "### Campaign Ads failed AND sales publication FAILED/SKIPPED (${{ steps.cfg.outputs.region }}) -- no dashboards published; LKG preserved" >> "$GITHUB_STEP_SUMMARY"

      # Keep the workflow honest after every source has had its chance and controls are safe-closed. The REQUIRED sales
      # source is OLI: an OLI failure (fatal / all-deferred exits nonzero, or a genuine source failure) keeps the run
      # RED (publication stayed closed, LKG preserved). Campaign is INDEPENDENT (best-effort ads) -- its failure is the
      # non-failing notice above, NOT a red run, because sales published honestly with ads unavailable. continue-on-error
      # on the source steps is sequencing only; it never turns a genuine SALES-source failure into a green run.
      - name: Report required (OLI) source failure after all attempts
        if: always() && steps.guard.outputs.run_required == 'true' && steps.tokengate.outcome == 'success' && steps.tokengate.outputs.proceed == 'true' && steps.oli.outcome != 'success'
        run: |
          echo "SOURCE_REFRESH_FAILED -- OLI (required sales source) outcome=${{ steps.oli.outcome }} (Campaign outcome=${{ steps.campaign.outcome }}, independent). Publication stayed closed and LKG was preserved." >&2
          exit 1

  # FBA Shipment Plan + marketplace-capable AWD -- ISOLATED job, its OWN runner + its OWN always-safe-close. Once the
  # regional duplicate/token guards allow work, it runs regardless of the coordinator's final result. Its own scope
  # resolver excludes stale-OLI accounts and preserves their LKG, so one OLI/Campaign failure cannot suppress valid FBA
  # sellers. A failure here is contained and can never undo coordinator publication. AWD remains account/marketplace
  # capability-gated (US + compatible EU5; Australia excluded).
  fba:
    needs: run
    if: always() && needs.run.outputs.region != '' && (needs.run.outputs.already_published == 'true' || needs.run.outputs.token_proceed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # P1: the machine-readable FBA-completeness contract. fba-plan-golive.mjs writes fba_complete (true ONLY when every
    # eligible account for the region published live -- a natural partial like 10/11 is fba_complete=false) and
    # fba_published to $GITHUB_OUTPUT; expose them as JOB outputs so Listing Health v3 gates on completeness, not the
    # exit code. A hard FBA failure leaves fba_complete empty -> also != 'true'.
    outputs:
      fba_complete: ${{ steps.fba.outputs.fba_complete }}
      fba_published: ${{ steps.fba.outputs.fba_published }}
    defaults:
      run:
        working-directory: sales-dashboard-live
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATADOE_API_KEY: ${{ secrets.DATADOE_API_KEY }}
      DATADOE_API_KEY_SECONDARY: ${{ secrets.DATADOE_API_KEY_SECONDARY }}
      PRIORITY_OPERATOR: laxmikant@superboring.in
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Resolve FBA per-region token ceiling
        id: fcfg
        run: |
          set -euo pipefail
          region="${{ needs.run.outputs.region }}"
          case "$region" in
            "india")     maxtok=30 ;;
            # europe-au raised 60 -> 90: Europe AWD (Listings) is now fetched for the EU5 accounts (GB/UK, DE, FR, IT,
            # ES) -- ~5 extra premium creates -> the batched plan is ~70 tokens; 90 fits it with headroom. Times,
            # ownership, watchdog + concurrency are UNCHANGED (this is only the FBA token-budget ceiling).
            "europe-au") maxtok=90 ;;
            "us-ca")     maxtok=40 ;;
            *) echo "Unknown region '$region' for FBA -- refusing (fail closed)." >&2; exit 1 ;;
          esac
          echo "maxtok=$maxtok" >> "$GITHUB_OUTPUT"
          echo "FBA region=$region ceiling=$maxtok"
      # --inventory-as-of is the SHARED inventory_asof (D-1) resolved once in the run job, so this FBA inventory
      # fetch (EXACTLY [D-1 .. D-1]) and the downstream Listing Health v3 job adopt ONE inventory identity (v3
      # reuses this exact cache).
      - name: FBA go-live for this region (batched fetch -> derive -> publish -> ownership -> ALWAYS safe-close)
        id: fba
        run: node scripts/release/fba-plan-golive.mjs --mode=go-live --region=${{ needs.run.outputs.region }} --max-tokens=${{ steps.fcfg.outputs.maxtok }} --inventory-as-of=${{ needs.run.outputs.inventory_asof }} --account-scope=${{ needs.run.outputs.scope }} --dispatch-id=${{ inputs.dispatch_id }} --run-token=${{ github.run_id }}-${{ github.run_attempt }}

  # Listing Health v3 SHADOW ingestion -- runs ONLY after THIS region's FBA inventory job SUCCEEDED, so v3's reuse-only
  # inventory tranche adopts the fresh FBA Plan inventory cache (zero inventory creates). It is NOT a new scheduler
  # owner: it is a dependent job of the SAME per-region workflow run, so it inherits the workflow-level per-region
  # `concurrency` group -- a delayed native cron and its Cloudflare watchdog re-dispatch resolve to the same region,
  # the same shared inventory_asof, and therefore the same operation id + request hashes (a replay is a zero-create,
  # zero-duplicate-snapshot no-op via the durable dedicated cycle). The UI stays OFF (LISTING_HEALTH_V3 unchanged); this
  # job only enables the INGESTION env gate, and only within itself. It creates ONLY Listings + Listings-Raw exports
  # within the per-region ceiling (India=4, Europe-AU=8, US-CA=4); inventory / OLI / Product Catalog are zero-create.
  listing-health-v3:
    needs: [run, fba]
    # A BOOTSTRAP-scoped run never ingests v3 (its per-region export ceiling belongs to the natural daily
    # run; the new accounts' shadow snapshots land on the next full run instead).
    # OPTIONAL-INVENTORY (per-account partial publication): v3 ingests whenever the PRIORITY run succeeded (OLI is
    # ready + the shared inventory_asof is resolved) -- it is NO LONGER gated on the FBA publish outcome. Listings +
    # durable OLI are v3's own required evidence (independent of FBA), so v3 must publish them regardless of how many
    # accounts FBA published: each account ADOPTS its FBA inventory where the reuse-only cache is fresh and leaves
    # inventory-dependent fields unavailable otherwise (operator per-account adoptability + the inventory Pass-2
    # complete-as-unavailable contract). This resolves the "FBA publishes ZERO accounts" case against the requested
    # optional-inventory behavior: v3 STILL runs (listings/OLI publish; inventory unavailable for all), rather than
    # being skipped by a whole-region FBA prerequisite. `needs: [run, fba]` is kept only for ORDERING (v3 runs AFTER
    # fba so it reuses whatever fresh FBA cache exists); `always()` means fba's result never skips v3. A failed
    # priority run (OLI not ready) or a bootstrap scope still skips v3. Inventory stays REUSE-ONLY (zero v3 inventory
    # creates); v3's own balance/authorization gate still bounds its Listings creates. The fba job still exports
    # fba_published (observability). materialize + materialize-inventory stay INDEPENDENT.
    if: always() && needs.run.result == 'success' && needs.run.outputs.region != '' && needs.run.outputs.scope != 'bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: sales-dashboard-live
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATADOE_API_KEY: ${{ secrets.DATADOE_API_KEY }}
      DATADOE_API_KEY_SECONDARY: ${{ secrets.DATADOE_API_KEY_SECONDARY }}
      PRIORITY_OPERATOR: laxmikant@superboring.in
      # The dedicated ingestion gate, enabled ONLY inside this job. It does NOT flip the UI flag LISTING_HEALTH_V3.
      LISTING_HEALTH_V3_INGESTION_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify required secrets are present (fail fast, never print values)
        run: |
          set -uo pipefail
          missing=""
          for v in POSTGRES_URL SUPABASE_SERVICE_ROLE_KEY DATADOE_API_KEY; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -z "${SUPABASE_URL:-}" ] && [ -z "${VITE_SUPABASE_URL:-}" ]; then missing="$missing SUPABASE_URL|VITE_SUPABASE_URL"; fi
          if [ -n "$missing" ]; then echo "STOP missing required repository secret(s):$missing" >&2; exit 1; fi
          echo "All required secrets present."
      - name: Install dependencies
        run: npm ci
      # --cycle-date AND the --confirm operation id BOTH use the SHARED inventory_asof from the run job (never a locally
      # recomputed date), so the v3 inventory identity matches the FBA cache and a watchdog replay is idempotent.
      - name: Listing Health v3 shadow ingestion for this region (Listings + Listings-Raw only; inventory reuse-only)
        run: node scripts/release/listing-health-v3-ingestion.mjs --region=${{ needs.run.outputs.region }} --mode=live --cycle-date=${{ needs.run.outputs.inventory_asof }} --confirm=listing-health-v3/${{ needs.run.outputs.region }}/${{ needs.run.outputs.inventory_asof }}

  # Report materialization -- scheduler-OWNED, ZERO-EXPORT derivation of the durable reports that would otherwise
  # self-heal on a browser GET (brand-view-brands, sku-movement per brand incl. ALL, returns-leakage). It depends ONLY
  # on the `run` job (the durable brand-sales / daily / OLI / catalog sources), NOT on `fba`, so an FBA failure can
  # never block these sales/returns reports. `if: always()` + LKG-preserving + idempotent-upsert means it is safe to
  # run every dispatch: a re-run whose durable evidence has not advanced writes nothing (unchanged), and a watchdog
  # replay produces no duplicate snapshot. There is NO DataDoe adapter on this path -- it is structurally incapable of
  # creating an export or spending a token (the runner fails if it observes a non-zero token count). The DataDoe key
  # is present only so the operator can resolve the primary organization fingerprint for its durable reads.
  materialize:
    needs: [run]
    # FULL-region materializers process EVERY region account and are SKIPPED in bootstrap scope (a
    # bootstrap run must write ZERO snapshots outside its immutable wave; the wave's Brand View converges
    # on the next natural run). Byte-identical for the natural (full) path.
    if: always() && needs.run.outputs.region != '' && needs.run.outputs.scope != 'bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: sales-dashboard-live
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATADOE_API_KEY: ${{ secrets.DATADOE_API_KEY }}
      PRIORITY_OPERATOR: laxmikant@superboring.in
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify required secrets are present (fail fast, never print values)
        run: |
          set -uo pipefail
          missing=""
          for v in POSTGRES_URL SUPABASE_SERVICE_ROLE_KEY DATADOE_API_KEY; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -z "${SUPABASE_URL:-}" ] && [ -z "${VITE_SUPABASE_URL:-}" ]; then missing="$missing SUPABASE_URL|VITE_SUPABASE_URL"; fi
          if [ -n "$missing" ]; then echo "STOP missing required repository secret(s):$missing" >&2; exit 1; fi
          echo "All required secrets present."
      - name: Install dependencies
        run: npm ci
      # --as-of uses the SHARED inventory_asof (D-1) from the run job as the future-guard ceiling; the derive
      # clamps down to each account's latest proven date, so no future or fabricated data can ever be materialized.
      - name: Materialize durable reports for this region (zero export; idempotent upsert)
        run: node scripts/release/report-materialization.mjs --region=${{ needs.run.outputs.region }} --mode=live --as-of=${{ needs.run.outputs.inventory_asof }}

  # FBA-aware Brand View materialization -- the BACKEND PRODUCER for brand-view + brand-view-portfolio (which serve via
  # deferRebuildOnRead and previously never converged without a manual Refresh). It depends on [run, fba, materialize]
  # so it runs AFTER the priority `run` (publishes brand-inventory), the `fba` job (publishes fba-plan), and the base
  # `materialize` (publishes brand-view-brands, its single-view brand list). `if: always()` -- it runs even when FBA
  # FAILS, publishing sales/Ads with FBA honestly unavailable (fbaAvailable:null, never a fabricated zero); it never
  # depends on needs.fba.result. ZERO DataDoe (no adapter); the runner fails on any non-zero token. It reuses the exact
  # serve builders + identities, so a natural run converges the pages with no user interaction.
  materialize-inventory:
    needs: [run, fba, materialize]
    # SKIPPED in bootstrap scope (full-region Brand View producer; must write ZERO outside-wave snapshots).
    # Byte-identical for the natural (full) path. (materialize is already bootstrap-skipped, so this job's
    # needs on it resolves 'skipped' in bootstrap and the explicit guard keeps it off too.)
    if: always() && needs.run.outputs.region != '' && needs.run.outputs.scope != 'bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: sales-dashboard-live
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATADOE_API_KEY: ${{ secrets.DATADOE_API_KEY }}
      PRIORITY_OPERATOR: laxmikant@superboring.in
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify required secrets are present (fail fast, never print values)
        run: |
          set -uo pipefail
          missing=""
          for v in POSTGRES_URL SUPABASE_SERVICE_ROLE_KEY DATADOE_API_KEY; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -z "${SUPABASE_URL:-}" ] && [ -z "${VITE_SUPABASE_URL:-}" ]; then missing="$missing SUPABASE_URL|VITE_SUPABASE_URL"; fi
          if [ -n "$missing" ]; then echo "STOP missing required repository secret(s):$missing" >&2; exit 1; fi
          echo "All required secrets present."
      - name: Install dependencies
        run: npm ci
      # Brand View asOf is derived per the serve (single: marketplaceToday(account.country); portfolio:
      # marketplaceToday("IN")); no --as-of override. --inventory-as-of is the shared cycle D-1 (needs.run.outputs.
      # inventory_asof): the compact brand-inventory rebuild binds its per-account authorization to it, so it only
      # refreshes a compact the priority run published for THIS cycle (never a stale/old-cycle row). Zero export.
      - name: Materialize Brand View + Portfolio for this region (zero export; idempotent upsert)
        run: node scripts/release/report-materialization-brandview.mjs --region=${{ needs.run.outputs.region }} --mode=live --inventory-as-of=${{ needs.run.outputs.inventory_asof }}

  # BOOTSTRAP ack (completed | failed) -- the dispatched run's durable FINISH receipt, keyed by the exact
  # dispatch identity. 'completed' is acked ONLY when: the `run` job is green (its honesty step fails it on
  # any OLI/Campaign source failure, and the scoped publication ran inside it) AND the `fba` job is green
  # AND a READ-ONLY completion proof (verify-bootstrap-published) confirms EVERY frozen wave account has its
  # required live dashboards (Daily Reporting + Brand Sales + Brand Inventory; FBA present or honest-
  # unavailable). ANYTHING else -- a missing publication/read-back, a deferred account, an empty/changed
  # scope -- acks 'failed' (retryable after the bounded backoff), NEVER 'completed'. Full-scope runs skip
  # this job entirely.
  bootstrap-ack:
    needs: [run, fba]
    if: always() && needs.run.outputs.scope == 'bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sales-dashboard-live
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      # The completion PROOF gate: only when the run + fba jobs are green does the read-only verify run;
      # it exits nonzero unless every wave account is live. 'completed' is acked ONLY on its success.
      - name: Prove every wave account's dashboards are live (read-only completion gate)
        id: verify_published
        continue-on-error: true
        if: needs.run.result == 'success' && needs.fba.result == 'success'
        run: node scripts/release/verify-bootstrap-published.mjs --region=${{ needs.run.outputs.region }} --dispatch-id=${{ inputs.dispatch_id }}
      # The completed/failed ack carries the SAME run token the run job stamped at 'running' (github.run_id
      # + run_attempt are constant across a workflow run's jobs), so it owns the lease; a superseded run's
      # token would not match and its ack would be a stale-ack no-op.
      - name: Acknowledge bootstrap dispatch (completed only when the completion proof passed)
        run: |
          set -euo pipefail
          if [ "${{ needs.run.result }}" = "success" ] && [ "${{ needs.fba.result }}" = "success" ] && [ "${{ steps.verify_published.outcome }}" = "success" ]; then
            node scripts/release/onboarding-dispatch-ack.mjs --region=${{ needs.run.outputs.region }} --dispatch-id=${{ inputs.dispatch_id }} --phase=completed --run-token=${{ github.run_id }}-${{ github.run_attempt }}
          else
            node scripts/release/onboarding-dispatch-ack.mjs --region=${{ needs.run.outputs.region }} --dispatch-id=${{ inputs.dispatch_id }} --phase=failed --note=RUN_${{ needs.run.result }}_FBA_${{ needs.fba.result }}_VERIFY_${{ steps.verify_published.outcome }} --run-token=${{ github.run_id }}-${{ github.run_attempt }}
          fi

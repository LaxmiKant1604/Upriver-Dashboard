name: scheduler-v2
run-name: scheduler-v2 ${{ github.event_name == 'workflow_dispatch' && format('{0}/{1}', inputs.region, inputs.dispatch_id) || github.event.schedule }}

# TRUSTED regional refresh + publish coordinator for the whole active dashboard pipeline (Scheduler v2) -- the ONLY
# automatic scheduler (no pg_cron, no Vercel cron; the full source-refresh + derive + publish flow exceeds Vercel's
# 60s route cap). It is ALSO the ONE automatic owner of every paid source (OLI, Product Catalog reuse, Campaign Ads):
# campaign-ads-golive.yml carries no cron, so Campaign Ads can never be refreshed by two schedulers.
#
# THREE REGIONS publish INDEPENDENTLY -- none waits for nor blocks another, and none ever touches another's snapshots.
# Each cron maps DETERMINISTICALLY to exactly one region (resolved from github.event.schedule, NEVER the wall clock);
# accounts are discovered + routed every run by trusted stored marketplace evidence, so a newly connected seller
# auto-joins its region with no config change:
#   - india     @ 03:00 UTC (08:30 IST): IN accounts.                              Cloudflare watchdog 03:20 UTC.
#   - europe-au @ 08:30 UTC (14:00 IST): European marketplaces incl GB/UK + AU.    Cloudflare watchdog 08:50 UTC.
#   - us-ca     @ 16:30 UTC (22:00 IST): US + CA accounts.                          Cloudflare watchdog 16:50 UTC.
#
# Each region run: read-only duplicate guard (a delayed/repeated trigger -- e.g. the watchdog -- is a zero-write no-op
# once the exact D-1 is already live) -> cycle preflight -> token gate -> OLI refresh to D-1 -> Campaign Ads refresh
# (once, this region) -> HONEST effectivePublishAsOf (bounded 2-day tail; interior gap / lag>2 fail closed) -> open
# controls for ONLY this region -> Catalog reuse + derive + preflight + publish this region's accounts x3 + live
# read-back -> rebuild Brand View membership -> ALWAYS safe-close controls. FBA Shipment Plan runs as a SEPARATE,
# isolated job with its own per-account OLI-coverage resolver and safe-close. OLI, Campaign Ads and FBA each receive a
# bounded attempt after the shared guards; source failures cannot suppress one another or weaken publication gates.
#
# Insufficient tokens is a TYPED SAFE SKIP (SKIPPED_INSUFFICIENT_TOKENS). An UNREADABLE balance hard-fails. A
# same-date terminal cycle collision fails at the preflight before any token read. A region that cannot publish
# honestly fails closed at the readiness proof BEFORE any control is opened -- every other region stays untouched.
#
# Required repository secrets (never printed): POSTGRES_URL, SUPABASE_URL (or VITE_SUPABASE_URL),
# SUPABASE_SERVICE_ROLE_KEY, DATADOE_API_KEY (+ DATADOE_API_KEY_SECONDARY if a secondary connection is configured).

on:
  schedule:
    # Each cron maps DETERMINISTICALLY to exactly one region (resolved from github.event.schedule, never the clock).
    - cron: "0 3 * * *"    # india     PRIMARY -- 03:00 UTC / 08:30 IST
    - cron: "30 8 * * *"   # europe-au PRIMARY -- 08:30 UTC / 14:00 IST
    - cron: "30 16 * * *"  # us-ca     PRIMARY -- 16:30 UTC / 22:00 IST
  workflow_dispatch:
    inputs:
      region:
        description: "Region to run + publish (india | europe-au | us-ca). Publishes ONLY that region's accounts."
        required: true
        default: "india"
      refresh_mode:
        description: "normal | force-latest. force-latest makes a FRESH bounded DataDoe re-fetch of the still-missing D-1 window (bypasses stale cache). Scheduled events are ALWAYS normal."
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - force-latest
      dispatch_id:
        description: "External scheduler identity used by the Cloudflare watchdog (external/<region>/<D-1>); ordinary manual runs may keep 'manual'."
        required: false
        default: "manual"

concurrency:
  # One in-flight run PER REGION (regions are independent); a re-dispatch of the same region queues behind its own run.
  # Resolve scheduled crons to the SAME region key used by workflow_dispatch. This prevents a delayed native cron
  # and its Cloudflare watchdog dispatch from running concurrently under different concurrency groups.
  group: scheduler-v2-${{ github.event_name == 'schedule' && (github.event.schedule == '0 3 * * *' && 'india' || github.event.schedule == '30 8 * * *' && 'europe-au' || github.event.schedule == '30 16 * * *' && 'us-ca' || 'unknown') || inputs.region }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: sales-dashboard-live
    outputs:
      region: ${{ steps.cfg.outputs.region }}
      asof: ${{ steps.cfg.outputs.asof }}
      # ONE shared inventory snapshot date (UTC today) computed exactly once here and consumed unchanged by BOTH the FBA
      # job and the Listing Health v3 job, so FBA inventory and v3 always adopt a single inventory identity. It is
      # DISTINCT from `asof` (D-1, for OLI/Ads). A watchdog re-dispatch for the same region+day recomputes the same value.
      inventory_asof: ${{ steps.cfg.outputs.inventory_asof }}
      run_required: ${{ steps.guard.outputs.run_required }}
      already_published: ${{ steps.guard.outputs.already_published }}
      token_proceed: ${{ steps.tokengate.outputs.proceed }}
      oli_ready: ${{ steps.guard.outputs.already_published == 'true' || steps.readiness.outputs.proceed == 'true' }}
      effective_asof: ${{ steps.readiness.outputs.effective_asof }}
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATADOE_API_KEY: ${{ secrets.DATADOE_API_KEY }}
      DATADOE_API_KEY_SECONDARY: ${{ secrets.DATADOE_API_KEY_SECONDARY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Secret validation MUST fail before any production I/O.
      - name: Verify required secrets are present (fail fast, never print values)
        run: |
          set -uo pipefail
          missing=""
          for v in POSTGRES_URL SUPABASE_SERVICE_ROLE_KEY DATADOE_API_KEY; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -z "${SUPABASE_URL:-}" ] && [ -z "${VITE_SUPABASE_URL:-}" ]; then missing="$missing SUPABASE_URL|VITE_SUPABASE_URL"; fi
          if [ -n "$missing" ]; then echo "STOP missing required repository secret(s):$missing" >&2; exit 1; fi
          echo "All required secrets present."

      - name: Resolve region + requestedAsOf (previous UTC date, = D-1) + refresh_mode + per-region token floor
        id: cfg
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Resolve the region from WHICH cron fired -- deterministic, never inferred from the wall clock.
            case "${{ github.event.schedule }}" in
              "0 3 * * *")   region="india"     ;;
              "30 8 * * *")  region="europe-au" ;;
              "30 16 * * *") region="us-ca"     ;;
              *) echo "Unknown cron '${{ github.event.schedule }}' -- refusing (fail closed)." >&2; exit 1 ;;
            esac
            # A SCHEDULED event is ALWAYS normal mode -- force-latest can be selected ONLY by workflow_dispatch.
            mode="normal"
          else
            region="${{ github.event.inputs.region }}"
            mode="${{ github.event.inputs.refresh_mode }}"
            if [ -z "$mode" ]; then mode="normal"; fi
          fi
          if [ "$region" != "india" ] && [ "$region" != "europe-au" ] && [ "$region" != "us-ca" ]; then echo "Invalid region '$region'." >&2; exit 1; fi
          if [ "$mode" != "normal" ] && [ "$mode" != "force-latest" ]; then echo "Invalid refresh_mode '$mode'." >&2; exit 1; fi
          # Per-region balance FLOOR for the token gate (worst-case dry-run: india ~10, europe-au ~16, us-ca ~8 tokens).
          case "$region" in
            "india")     tokenmin=10 ;;
            "europe-au") tokenmin=20 ;;
            "us-ca")     tokenmin=10 ;;
          esac
          asof="$(date -u -d 'yesterday' +%Y-%m-%d)"
          # ONE shared inventory snapshot date = UTC today, computed EXACTLY ONCE here. FBA inventory + Listing Health v3
          # both adopt this identity; the downstream v3 job must NEVER recompute UTC today independently. Distinct from
          # asof (D-1). Matches fbaInventoryAsOf() (UTC today) so the FBA inventory cache the v3 tranche reuses aligns.
          inventory_asof="$(date -u +%Y-%m-%d)"
          # Durable operation identity is region + requestedAsOf (NOT the cron) so the primary + the watchdog share ONE
          # operation + one durable token/create budget (idempotent adoption).
          opkey="scheduled-fresh/$region/$asof"
          echo "region=$region" >> "$GITHUB_OUTPUT"
          echo "asof=$asof" >> "$GITHUB_OUTPUT"
          echo "inventory_asof=$inventory_asof" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "tokenmin=$tokenmin" >> "$GITHUB_OUTPUT"
          echo "opkey=$opkey" >> "$GITHUB_OUTPUT"
          {
            echo "### scheduler-v2 run (regional)";
            echo "- event: ${{ github.event_name }} · cron: \`${{ github.event.schedule }}\` · dispatch identity: \`${{ inputs.dispatch_id }}\`";
            echo "- resolved region: **$region** (publishes ONLY this region; every other region is untouched)";
            echo "- head/workflow SHA: \`${{ github.sha }}\` · run id: ${{ github.run_id }} (attempt ${{ github.run_attempt }})";
            echo "- requestedAsOf (D-1): $asof · inventoryAsOf (UTC today, shared FBA+v3): $inventory_asof · refresh_mode: $mode · operation key: \`$opkey\` · token floor: $tokenmin";
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Resolved event=${{ github.event_name }} cron='${{ github.event.schedule }}' region=$region requestedAsOf=$asof inventoryAsOf=$inventory_asof mode=$mode opkey=$opkey tokenmin=$tokenmin"

      - name: Install dependencies
        run: npm ci

      # Per-REGION whole-workflow duplicate guard. A delayed GitHub cron and the +20min Cloudflare watchdog can both
      # dispatch the same region D-1. Before cycle/token/control I/O, prove the exact current region-account x 3-report
      # live identities through the real storage-first frontend payload read-back. Complete => green no-op with ZERO
      # creates/writes/tokens. Incomplete => continue through the unchanged fail-closed pipeline.
      - name: Prove this region's D-1 is not already fully published (read-only duplicate guard)
        id: guard
        run: node scripts/release/verify-us-d1-published.mjs --bucket=${{ steps.cfg.outputs.region }} --requested-as-of=${{ steps.cfg.outputs.asof }}

      - name: Report already-published no-op
        if: steps.guard.outputs.already_published == 'true'
        run: echo "ALREADY_PUBLISHED_D1 -- exact live read-backs passed for ${{ steps.cfg.outputs.region }}; zero creates, zero controls, zero tokens."

      # (step 1) cycle-identity preflight: a same-date terminal collision fails EARLY, before any token read.
      - name: Cycle-identity preflight (this region)
        if: steps.guard.outputs.run_required == 'true'
        run: node scripts/release/scheduled-cycle-preflight.mjs --bucket=${{ steps.cfg.outputs.region }}

      # (step 2) Token gate: per-region balance floor. Unreadable balance hard-fails; insufficient tokens is a typed
      # safe skip (proceed=false) so every create/control step below is skipped.
      - name: Confirm token budget (per-region floor, before any create)
        id: tokengate
        if: steps.guard.outputs.run_required == 'true'
        run: node scripts/release/confirm-token-budget.mjs --min=${{ steps.cfg.outputs.tokenmin }} --bucket=${{ steps.cfg.outputs.region }}

      # (step 3) Refresh OLI to D-1 for THIS region (supersede a stale terminal cycle + auto-escalate a fresh fetch of
      # the still-missing <=5-seller batches, within the region's derived create/token ceiling). Record its raw outcome
      # instead of aborting the job so the independent Campaign Ads and FBA pipelines still get their own attempt.
      - name: Refresh OLI to D-1 (supersede stale terminal cycle + auto-escalate fresh fetch)
        id: oli
        continue-on-error: true
        if: steps.guard.outputs.run_required == 'true' && steps.tokengate.outputs.proceed == 'true'
        run: node scripts/release/oli-refresh-d1.mjs --bucket=${{ steps.cfg.outputs.region }} --requested-as-of=${{ steps.cfg.outputs.asof }} --refresh-mode=${{ steps.cfg.outputs.mode }} --run-id=${{ github.run_id }}

      # (step 4) Refresh CAMPAIGN Ads for THIS region ONCE (coverage mode, 21-day rolling window). Campaign is the ONLY
      # active Ads source and scheduler-v2 is its ONE automatic owner. Idempotent (already-covered => zero creates).
      # ASIN Ads exports are retired (a hard guard in ads-sync.js refuses them from every entry point). `always()` is
      # intentional: Campaign has its own compatibility preflight, <=5-seller recovery split and LKG isolation, so an
      # unrelated OLI failure must never suppress this source's bounded attempt.
      - name: Refresh Campaign Ads (this region only; coverage mode, 21-day rolling window)
        id: campaign
        continue-on-error: true
        if: always() && steps.guard.outputs.run_required == 'true' && steps.tokengate.outcome == 'success' && steps.tokengate.outputs.proceed == 'true'
        run: node scripts/release/scheduled-campaign-ads-refresh.mjs --bucket=${{ steps.cfg.outputs.region }} --as-of=${{ steps.cfg.outputs.asof }}

      # (step 5) STRICT D-1 readiness proof (read-only). Publication requires EVERY account gapless through the EXACT
      # requestedAsOf (D-1). A settlement tail (proven only through D-2), interior gap, blank provenance, or unreadable
      # coverage is a typed DATADOE_D1_NOT_READY: fail closed BEFORE any control is opened, publish steps skipped, LKG retained.
      - name: Prove previous-day (D-1) readiness for this region (read-only; strict)
        id: readiness
        if: always() && steps.guard.outputs.run_required == 'true' && steps.tokengate.outcome == 'success' && steps.tokengate.outputs.proceed == 'true' && steps.oli.outcome == 'success'
        run: node scripts/release/verify-bucket-readiness.mjs --bucket=${{ steps.cfg.outputs.region }} --requested-as-of=${{ steps.cfg.outputs.asof }}

      # (step 7) Open publication controls for ONLY this region's accounts x 3 keys (all_primary stays false).
      - name: Open publication controls (this region only)
        if: steps.guard.outputs.run_required == 'true' && steps.tokengate.outputs.proceed == 'true' && steps.oli.outcome == 'success' && steps.campaign.outcome == 'success' && steps.readiness.outputs.proceed == 'true'
        run: node scripts/release/priority-control-package.mjs --apply --bucket=${{ steps.cfg.outputs.region }}

      # (steps 6/8/9/10) Catalog reuse/refresh (ONE create/day shared across ALL regions via the date-only operation
      # key) + derive + preflight EVERY account in this region + publish this region x3 + live read-back. Reached ONLY
      # after the strict D-1 proof; --strict-d1 fails closed (never publishes) if the derive would clamp below D-1.
      - name: Refresh Catalog + derive/preflight/publish this region at D-1 + live read-back
        if: steps.guard.outputs.run_required == 'true' && steps.tokengate.outputs.proceed == 'true' && steps.oli.outcome == 'success' && steps.campaign.outcome == 'success' && steps.readiness.outputs.proceed == 'true'
        run: node scripts/release/priority-dashboards-release.mjs --bucket=${{ steps.cfg.outputs.region }} --as-of=${{ steps.readiness.outputs.effective_asof }} --operation-key=priority-dashboards/scheduled/${{ steps.cfg.outputs.asof }} --strict-d1

      # (step 11) Rebuild + verify Brand View membership from ALL current brand-sales snapshots (this region's fresh +
      # every other region's latest-known-good) -- Supabase-only, zero tokens.
      - name: Rebuild + verify Brand View membership (this region's fresh + others' LKG; Supabase-only)
        if: steps.guard.outputs.run_required == 'true' && steps.tokengate.outputs.proceed == 'true' && steps.oli.outcome == 'success' && steps.campaign.outcome == 'success' && steps.readiness.outputs.proceed == 'true'
        run: node scripts/release/rebuild-brand-membership.mjs

      # (step 12) Safe-close publication controls after every real pipeline attempt, idempotent + discovery-independent.
      - name: Safe-close publication controls (ALWAYS, idempotent)
        if: always() && steps.guard.outputs.run_required == 'true'
        run: node scripts/release/priority-control-package.mjs --rollback

      - name: Report insufficient-tokens skip
        if: always() && steps.guard.outputs.run_required == 'true' && steps.tokengate.outputs.proceed != 'true' && steps.tokengate.outcome == 'success'
        run: echo "SKIPPED_INSUFFICIENT_TOKENS -- no creates, no controls, LKG unchanged (region=${{ steps.cfg.outputs.region }} requestedAsOf=${{ steps.cfg.outputs.asof }})."

      # Keep the workflow honest after every independent source has had its chance and controls are safe-closed.
      # continue-on-error above is sequencing only; it must never turn a genuine source failure into a green run.
      - name: Report independent source failure after all attempts
        if: always() && steps.guard.outputs.run_required == 'true' && steps.tokengate.outcome == 'success' && steps.tokengate.outputs.proceed == 'true' && (steps.oli.outcome != 'success' || steps.campaign.outcome != 'success')
        run: |
          echo "SOURCE_REFRESH_FAILED -- OLI outcome=${{ steps.oli.outcome }} Campaign outcome=${{ steps.campaign.outcome }}. Independent attempts completed; publication stayed closed and LKG was preserved." >&2
          exit 1

  # FBA Shipment Plan + marketplace-capable AWD -- ISOLATED job, its OWN runner + its OWN always-safe-close. Once the
  # regional duplicate/token guards allow work, it runs regardless of the coordinator's final result. Its own scope
  # resolver excludes stale-OLI accounts and preserves their LKG, so one OLI/Campaign failure cannot suppress valid FBA
  # sellers. A failure here is contained and can never undo coordinator publication. AWD remains account/marketplace
  # capability-gated (US + compatible EU5; Australia excluded).
  fba:
    needs: run
    if: always() && needs.run.outputs.region != '' && (needs.run.outputs.already_published == 'true' || needs.run.outputs.token_proceed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: sales-dashboard-live
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATADOE_API_KEY: ${{ secrets.DATADOE_API_KEY }}
      DATADOE_API_KEY_SECONDARY: ${{ secrets.DATADOE_API_KEY_SECONDARY }}
      PRIORITY_OPERATOR: laxmikant@superboring.in
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Resolve FBA per-region token ceiling
        id: fcfg
        run: |
          set -euo pipefail
          region="${{ needs.run.outputs.region }}"
          case "$region" in
            "india")     maxtok=30 ;;
            # europe-au raised 60 -> 90: Europe AWD (Listings) is now fetched for the EU5 accounts (GB/UK, DE, FR, IT,
            # ES) -- ~5 extra premium creates -> the batched plan is ~70 tokens; 90 fits it with headroom. Times,
            # ownership, watchdog + concurrency are UNCHANGED (this is only the FBA token-budget ceiling).
            "europe-au") maxtok=90 ;;
            "us-ca")     maxtok=40 ;;
            *) echo "Unknown region '$region' for FBA -- refusing (fail closed)." >&2; exit 1 ;;
          esac
          echo "maxtok=$maxtok" >> "$GITHUB_OUTPUT"
          echo "FBA region=$region ceiling=$maxtok"
      # --inventory-as-of is the SHARED inventory_asof (UTC today) resolved once in the run job, so this FBA inventory
      # fetch and the downstream Listing Health v3 job adopt ONE inventory identity (v3 reuses this exact cache).
      - name: FBA go-live for this region (batched fetch -> derive -> publish -> ownership -> ALWAYS safe-close)
        run: node scripts/release/fba-plan-golive.mjs --mode=go-live --region=${{ needs.run.outputs.region }} --max-tokens=${{ steps.fcfg.outputs.maxtok }} --inventory-as-of=${{ needs.run.outputs.inventory_asof }}

  # Listing Health v3 SHADOW ingestion -- runs ONLY after THIS region's FBA inventory job SUCCEEDED, so v3's reuse-only
  # inventory tranche adopts the fresh FBA Plan inventory cache (zero inventory creates). It is NOT a new scheduler
  # owner: it is a dependent job of the SAME per-region workflow run, so it inherits the workflow-level per-region
  # `concurrency` group -- a delayed native cron and its Cloudflare watchdog re-dispatch resolve to the same region,
  # the same shared inventory_asof, and therefore the same operation id + request hashes (a replay is a zero-create,
  # zero-duplicate-snapshot no-op via the durable dedicated cycle). The UI stays OFF (LISTING_HEALTH_V3 unchanged); this
  # job only enables the INGESTION env gate, and only within itself. It creates ONLY Listings + Listings-Raw exports
  # within the per-region ceiling (India=4, Europe-AU=8, US-CA=4); inventory / OLI / Product Catalog are zero-create.
  listing-health-v3:
    needs: [run, fba]
    if: always() && needs.run.outputs.region != '' && needs.fba.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: sales-dashboard-live
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATADOE_API_KEY: ${{ secrets.DATADOE_API_KEY }}
      DATADOE_API_KEY_SECONDARY: ${{ secrets.DATADOE_API_KEY_SECONDARY }}
      PRIORITY_OPERATOR: laxmikant@superboring.in
      # The dedicated ingestion gate, enabled ONLY inside this job. It does NOT flip the UI flag LISTING_HEALTH_V3.
      LISTING_HEALTH_V3_INGESTION_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify required secrets are present (fail fast, never print values)
        run: |
          set -uo pipefail
          missing=""
          for v in POSTGRES_URL SUPABASE_SERVICE_ROLE_KEY DATADOE_API_KEY; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -z "${SUPABASE_URL:-}" ] && [ -z "${VITE_SUPABASE_URL:-}" ]; then missing="$missing SUPABASE_URL|VITE_SUPABASE_URL"; fi
          if [ -n "$missing" ]; then echo "STOP missing required repository secret(s):$missing" >&2; exit 1; fi
          echo "All required secrets present."
      - name: Install dependencies
        run: npm ci
      # --cycle-date AND the --confirm operation id BOTH use the SHARED inventory_asof from the run job (never a locally
      # recomputed UTC today), so the v3 inventory identity matches the FBA cache and a watchdog replay is idempotent.
      - name: Listing Health v3 shadow ingestion for this region (Listings + Listings-Raw only; inventory reuse-only)
        run: node scripts/release/listing-health-v3-ingestion.mjs --region=${{ needs.run.outputs.region }} --mode=live --cycle-date=${{ needs.run.outputs.inventory_asof }} --confirm=listing-health-v3/${{ needs.run.outputs.region }}/${{ needs.run.outputs.inventory_asof }}

  # Report materialization -- scheduler-OWNED, ZERO-EXPORT derivation of the durable reports that would otherwise
  # self-heal on a browser GET (brand-view-brands, sku-movement per brand incl. ALL, returns-leakage). It depends ONLY
  # on the `run` job (the durable brand-sales / daily / OLI / catalog sources), NOT on `fba`, so an FBA failure can
  # never block these sales/returns reports. `if: always()` + LKG-preserving + idempotent-upsert means it is safe to
  # run every dispatch: a re-run whose durable evidence has not advanced writes nothing (unchanged), and a watchdog
  # replay produces no duplicate snapshot. There is NO DataDoe adapter on this path -- it is structurally incapable of
  # creating an export or spending a token (the runner fails if it observes a non-zero token count). The DataDoe key
  # is present only so the operator can resolve the primary organization fingerprint for its durable reads.
  materialize:
    needs: [run]
    if: always() && needs.run.outputs.region != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: sales-dashboard-live
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATADOE_API_KEY: ${{ secrets.DATADOE_API_KEY }}
      PRIORITY_OPERATOR: laxmikant@superboring.in
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify required secrets are present (fail fast, never print values)
        run: |
          set -uo pipefail
          missing=""
          for v in POSTGRES_URL SUPABASE_SERVICE_ROLE_KEY DATADOE_API_KEY; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -z "${SUPABASE_URL:-}" ] && [ -z "${VITE_SUPABASE_URL:-}" ]; then missing="$missing SUPABASE_URL|VITE_SUPABASE_URL"; fi
          if [ -n "$missing" ]; then echo "STOP missing required repository secret(s):$missing" >&2; exit 1; fi
          echo "All required secrets present."
      - name: Install dependencies
        run: npm ci
      # --as-of uses the SHARED inventory_asof (UTC today) from the run job as the future-guard ceiling; the derive
      # clamps down to each account's latest proven date, so no future or fabricated data can ever be materialized.
      - name: Materialize durable reports for this region (zero export; idempotent upsert)
        run: node scripts/release/report-materialization.mjs --region=${{ needs.run.outputs.region }} --mode=live --as-of=${{ needs.run.outputs.inventory_asof }}

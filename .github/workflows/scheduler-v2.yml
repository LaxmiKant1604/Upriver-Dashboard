name: scheduler-v2

# TRUSTED refresh + publish workflow for Daily Reporting + Brand View (Scheduler v2) -- the ONLY automatic scheduler
# (no pg_cron, no Vercel cron; the full source-refresh + derive + publish flow exceeds Vercel's 60s route cap).
#
# The two buckets publish INDEPENDENTLY -- neither waits for nor blocks the other, and neither ever touches the
# other's snapshots. Each run: cycle preflight -> token gate -> OLI refresh -> ASIN Ads refresh -> compute this
# bucket's HONEST effectivePublishAsOf (bounded 2-day settlement tail; interior gap / lag>2 fail closed) -> open
# controls for ONLY this bucket -> Catalog + derive + preflight + publish this bucket's accounts x3 + live read-back
# -> rebuild Brand View membership (this bucket's fresh brand-sales + the other bucket's latest-known-good) -> ALWAYS
# safe-close controls. Publication is all-or-nothing WITHIN a bucket (preflight every account before the first write).
#
#   - non-us @ 02:00 UTC (07:30 IST): publishes the 22 Non-US accounts; visible ~08:00-09:00 IST. Never touches US.
#   - us     @ 10:30 UTC (16:00 IST): publishes the 8 US accounts; visible ~16:30-17:30 IST. Never touches Non-US,
#     and does NOT require the same-day Non-US run to have completed.
#
# Insufficient tokens is a TYPED SAFE SKIP (SKIPPED_INSUFFICIENT_TOKENS): the token gate sets proceed=false, every
# create/control step is skipped, and the run reports the skip -- no creates, no controls, LKG unchanged. An
# UNREADABLE balance hard-fails. A same-date terminal cycle collision fails at the preflight before any token read.
# A bucket that cannot publish honestly (interior OLI gap, blank provenance, tail lag > 2 days, unreadable coverage)
# fails closed at the readiness proof BEFORE any control is opened -- the OTHER bucket's snapshots stay untouched.
#
# Required repository secrets (never printed): POSTGRES_URL, SUPABASE_URL (or VITE_SUPABASE_URL),
# SUPABASE_SERVICE_ROLE_KEY, DATADOE_API_KEY (+ DATADOE_API_KEY_SECONDARY if a secondary connection is configured).

on:
  schedule:
    # 02:00 UTC = 07:30 IST -> the Non-US bucket publish; 10:30 UTC = 16:00 IST -> the US bucket publish. Each derives
    # + publishes ONLY its own bucket's accounts. The bucket is resolved from WHICH cron fired -- never from the clock.
    - cron: "0 2 * * *"
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      bucket:
        description: "Bucket to run + publish (us | non-us). Publishes ONLY that bucket's accounts."
        required: true
        default: "non-us"
      refresh_mode:
        description: "normal | force-latest. force-latest makes a FRESH bounded DataDoe re-fetch of the still-missing D-1 window (bypasses stale cache). Scheduled events are ALWAYS normal."
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - force-latest

concurrency:
  group: scheduler-v2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: sales-dashboard-live
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATADOE_API_KEY: ${{ secrets.DATADOE_API_KEY }}
      DATADOE_API_KEY_SECONDARY: ${{ secrets.DATADOE_API_KEY_SECONDARY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Secret validation MUST fail before any production I/O.
      - name: Verify required secrets are present (fail fast, never print values)
        run: |
          set -uo pipefail
          missing=""
          for v in POSTGRES_URL SUPABASE_SERVICE_ROLE_KEY DATADOE_API_KEY; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -z "${SUPABASE_URL:-}" ] && [ -z "${VITE_SUPABASE_URL:-}" ]; then missing="$missing SUPABASE_URL|VITE_SUPABASE_URL"; fi
          if [ -n "$missing" ]; then echo "STOP missing required repository secret(s):$missing" >&2; exit 1; fi
          echo "All required secrets present."

      - name: Resolve bucket + requestedAsOf (previous UTC date, = D-1) + refresh_mode + per-run token ceiling
        id: cfg
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Resolve the bucket from WHICH cron fired -- deterministic, never inferred from the wall clock.
            case "${{ github.event.schedule }}" in
              "0 2 * * *")   bucket="non-us" ;;
              "30 10 * * *") bucket="us" ;;
              *) echo "Unknown cron '${{ github.event.schedule }}' -- refusing (fail closed)." >&2; exit 1 ;;
            esac
            # A SCHEDULED event is ALWAYS normal mode -- force-latest can be selected ONLY by workflow_dispatch.
            mode="normal"
          else
            bucket="${{ github.event.inputs.bucket }}"
            mode="${{ github.event.inputs.refresh_mode }}"
            if [ -z "$mode" ]; then mode="normal"; fi
          fi
          if [ "$bucket" != "us" ] && [ "$bucket" != "non-us" ]; then echo "Invalid bucket '$bucket'." >&2; exit 1; fi
          if [ "$mode" != "normal" ] && [ "$mode" != "force-latest" ]; then echo "Invalid refresh_mode '$mode'." >&2; exit 1; fi
          if [ "$bucket" = "non-us" ]; then tokenmin=20; else tokenmin=10; fi
          asof="$(date -u -d 'yesterday' +%Y-%m-%d)"
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "asof=$asof" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "tokenmin=$tokenmin" >> "$GITHUB_OUTPUT"
          { echo "### scheduler-v2 run"; echo "- bucket: $bucket (publishes ONLY this bucket; the other bucket is untouched)"; echo "- requestedAsOf (D-1): $asof"; echo "- refresh_mode: $mode"; echo "- token ceiling: $tokenmin"; } >> "$GITHUB_STEP_SUMMARY"
          echo "Resolved bucket=$bucket requestedAsOf=$asof mode=$mode tokenmin=$tokenmin"

      - name: Install dependencies
        run: npm ci

      # (step 1) cycle-identity preflight: a same-date terminal collision fails EARLY, before any token read.
      - name: Cycle-identity preflight (this bucket)
        run: node scripts/release/scheduled-cycle-preflight.mjs --bucket=${{ steps.cfg.outputs.bucket }}

      # (step 2) Token gate: exact per-run ceiling. Unreadable balance hard-fails; insufficient tokens is a typed safe
      # skip (proceed=false) so every create/control step below is skipped.
      - name: Confirm token budget (>=20 Non-US / >=10 US, before any create)
        id: tokengate
        run: node scripts/release/confirm-token-budget.mjs --min=${{ steps.cfg.outputs.tokenmin }} --bucket=${{ steps.cfg.outputs.bucket }}

      # (step 3) Refresh OLI to D-1 for THIS bucket. Decouples cycle-completion from source-freshness: a running/fresh
      # cycle drains normally; a TERMINAL cycle whose durable coverage is below D-1 is STALE evidence -> a durable
      # SUPERSEDING running attempt is opened (the terminal cycle stays immutable) and OLI is re-fetched FRESH
      # (forceFreshOli bypasses the 20h stale cache). After the drain it auto-escalates ONE bounded fresh re-fetch of
      # only the still-missing <=5-seller batches, within the per-bucket create/token ceiling. normal mode uses the
      # scheduled-fresh operation identity; force-latest uses manual-force/<bucket>/<D-1>/<github.run_id>.
      - name: Refresh OLI to D-1 (supersede stale terminal cycle + auto-escalate fresh fetch)
        if: steps.tokengate.outputs.proceed == 'true'
        run: node scripts/release/oli-refresh-d1.mjs --bucket=${{ steps.cfg.outputs.bucket }} --requested-as-of=${{ steps.cfg.outputs.asof }} --refresh-mode=${{ steps.cfg.outputs.mode }} --run-id=${{ github.run_id }}

      # (step 4) Refresh ASIN Ads for THIS bucket only (coverage mode, 21-day rolling window).
      - name: Refresh ASIN Ads (this bucket only; coverage mode, 21-day rolling window)
        if: steps.tokengate.outputs.proceed == 'true'
        run: node scripts/release/scheduled-asin-ads-refresh.mjs --bucket=${{ steps.cfg.outputs.bucket }} --as-of=${{ steps.cfg.outputs.asof }}

      # (step 5) STRICT D-1 readiness proof (read-only). Publication requires EVERY account gapless through the EXACT
      # requestedAsOf (D-1). A settlement tail (proven only through D-2), interior gap, blank provenance, or unreadable
      # coverage is a typed DATADOE_D1_NOT_READY: this step fails closed BEFORE any control is opened, the publish steps
      # below are skipped (success()-gated), the LKG is retained, and the summary distinguishes it from a D-1 success.
      - name: Prove previous-day (D-1) readiness for this bucket (read-only; strict)
        id: readiness
        if: steps.tokengate.outputs.proceed == 'true'
        run: node scripts/release/verify-bucket-readiness.mjs --bucket=${{ steps.cfg.outputs.bucket }} --requested-as-of=${{ steps.cfg.outputs.asof }}

      # (step 7) Open publication controls for ONLY this bucket's accounts x 3 keys (all_primary stays false).
      - name: Open publication controls (this bucket only)
        if: steps.tokengate.outputs.proceed == 'true'
        run: node scripts/release/priority-control-package.mjs --apply --bucket=${{ steps.cfg.outputs.bucket }}

      # (steps 6/8/9/10) Catalog reuse/refresh (one create/day shared across buckets) + derive + preflight EVERY
      # account in this bucket + publish this bucket x3 + live read-back. Reached ONLY after the strict D-1 proof, so
      # --as-of is the requestedAsOf (D-1); --strict-d1 is a belt-and-suspenders that FAILS CLOSED (never publishes)
      # if the derive would clamp below D-1. The operation key is the requestedAsOf so BOTH buckets share one Catalog.
      - name: Refresh Catalog + derive/preflight/publish this bucket at D-1 + live read-back
        if: steps.tokengate.outputs.proceed == 'true'
        run: node scripts/release/priority-dashboards-release.mjs --bucket=${{ steps.cfg.outputs.bucket }} --as-of=${{ steps.readiness.outputs.effective_asof }} --operation-key=priority-dashboards/scheduled/${{ steps.cfg.outputs.asof }} --strict-d1

      # (step 11) Rebuild + verify Brand View membership from ALL current brand-sales snapshots (this bucket's fresh
      # snapshots + the OTHER bucket's latest-known-good) -- Supabase-only, zero tokens.
      - name: Rebuild + verify Brand View membership (this bucket's fresh + other bucket's LKG; Supabase-only)
        if: steps.tokengate.outputs.proceed == 'true'
        run: node scripts/release/rebuild-brand-membership.mjs

      # (step 12) Safe-close publication controls ALWAYS (both buckets), idempotent + discovery-independent.
      - name: Safe-close publication controls (ALWAYS, idempotent)
        if: always()
        run: node scripts/release/priority-control-package.mjs --rollback

      - name: Report insufficient-tokens skip
        if: always() && steps.tokengate.outputs.proceed != 'true' && steps.tokengate.outcome == 'success'
        run: echo "SKIPPED_INSUFFICIENT_TOKENS -- no creates, no controls, LKG unchanged (bucket=${{ steps.cfg.outputs.bucket }} requestedAsOf=${{ steps.cfg.outputs.asof }})."

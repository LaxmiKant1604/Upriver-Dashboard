name: scheduler-v2

# TRUSTED MANUAL refresh workflow for Daily Reporting + Brand View (Scheduler v2). Automatic cron triggers are
# PAUSED while the production OLI HTTP-400 request rejection is corrected and manually verified. The full
# source-refresh + derive + publish flow exceeds Vercel's 60s route cap; NO pg_cron and NO Vercel cron exist.
# Daily Reporting + Brand View only -- Campaign Ads, FBA and every unrelated report are structurally absent.
#
#   - non-us @ 02:00 UTC (07:30 IST): cycle preflight -> confirm >=20 tokens -> Non-US OLI -> Non-US ASIN Ads ->
#     read-only post-run proof. NO publication.
#   - us     @ 10:30 UTC (16:00 IST): prove the SAME-asOf Non-US run completed -> confirm >=10 tokens -> US OLI ->
#     US ASIN Ads -> open controls -> Catalog + derive + preflight + publish all 30x3 -> rebuild Brand View
#     membership -> live read-back -> ALWAYS safe-close controls.
#
# Insufficient tokens is a TYPED SAFE SKIP (SKIPPED_INSUFFICIENT_TOKENS): the token gate sets proceed=false, every
# create/control step is skipped, and the run reports the skip -- no creates, no controls, LKG unchanged. An
# UNREADABLE balance hard-fails. A same-date terminal cycle collision fails at the preflight before any token read.
#
# Required repository secrets (never printed): POSTGRES_URL, SUPABASE_URL (or VITE_SUPABASE_URL),
# SUPABASE_SERVICE_ROLE_KEY, DATADOE_API_KEY (+ DATADOE_API_KEY_SECONDARY if a secondary connection is configured).

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: "Bucket to run (us | non-us). us also derives + publishes all 30 accounts."
        required: true
        default: "non-us"

concurrency:
  group: scheduler-v2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: sales-dashboard-live
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATADOE_API_KEY: ${{ secrets.DATADOE_API_KEY }}
      DATADOE_API_KEY_SECONDARY: ${{ secrets.DATADOE_API_KEY_SECONDARY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Secret validation MUST fail before any production I/O.
      - name: Verify required secrets are present (fail fast, never print values)
        run: |
          set -uo pipefail
          missing=""
          for v in POSTGRES_URL SUPABASE_SERVICE_ROLE_KEY DATADOE_API_KEY; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -z "${SUPABASE_URL:-}" ] && [ -z "${VITE_SUPABASE_URL:-}" ]; then missing="$missing SUPABASE_URL|VITE_SUPABASE_URL"; fi
          if [ -n "$missing" ]; then echo "STOP missing required repository secret(s):$missing" >&2; exit 1; fi
          echo "All required secrets present."

      - name: Resolve bucket + asOf (previous UTC date) + per-run token ceiling
        id: cfg
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Automatic scheduling is paused; only workflow_dispatch is accepted." >&2; exit 1
          fi
          bucket="${{ github.event.inputs.bucket }}"
          if [ "$bucket" != "us" ] && [ "$bucket" != "non-us" ]; then echo "Invalid bucket '$bucket'." >&2; exit 1; fi
          if [ "$bucket" = "non-us" ]; then tokenmin=20; else tokenmin=10; fi
          asof="$(date -u -d 'yesterday' +%Y-%m-%d)"
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "asof=$asof" >> "$GITHUB_OUTPUT"
          echo "tokenmin=$tokenmin" >> "$GITHUB_OUTPUT"
          { echo "### scheduler-v2 run"; echo "- bucket: $bucket"; echo "- asOf: $asof"; echo "- token ceiling: $tokenmin"; } >> "$GITHUB_STEP_SUMMARY"
          echo "Resolved bucket=$bucket asOf=$asof tokenmin=$tokenmin"

      - name: Install dependencies
        run: npm ci

      # (Non-US step 4) cycle-identity preflight: a same-date terminal collision fails EARLY, before any token read.
      - name: Cycle-identity preflight (this bucket)
        run: node scripts/release/scheduled-cycle-preflight.mjs --bucket=${{ steps.cfg.outputs.bucket }}

      # (US step 4) prove the SAME-asOf Non-US run completed BEFORE the US token gate / creates / controls.
      - name: Prove same-asOf Non-US completion (us run only, before creates/controls)
        if: steps.cfg.outputs.bucket == 'us'
        run: node scripts/release/verify-scheduled-prerequisites.mjs --as-of=${{ steps.cfg.outputs.asof }}

      # Token gate: exact per-run ceiling. Unreadable balance hard-fails; insufficient tokens is a typed safe skip
      # (proceed=false) so every create/control step below is skipped.
      - name: Confirm token budget (>=20 Non-US / >=10 US, before any create)
        id: tokengate
        run: node scripts/release/confirm-token-budget.mjs --min=${{ steps.cfg.outputs.tokenmin }} --bucket=${{ steps.cfg.outputs.bucket }}

      - name: Refresh canonical OLI (this bucket only)
        if: steps.tokengate.outputs.proceed == 'true'
        run: node scripts/release/scheduled-oli-refresh.mjs --bucket=${{ steps.cfg.outputs.bucket }} --as-of=${{ steps.cfg.outputs.asof }}

      - name: Refresh ASIN Ads (this bucket only; coverage mode, 21-day rolling window)
        if: steps.tokengate.outputs.proceed == 'true'
        run: node scripts/release/scheduled-asin-ads-refresh.mjs --bucket=${{ steps.cfg.outputs.bucket }} --as-of=${{ steps.cfg.outputs.asof }}

      # (Non-US step 8) exact read-only post-run proof: the Non-US OLI + ASIN-Ads evidence is now complete.
      - name: Non-US post-run proof (non-us run only; no publication)
        if: steps.cfg.outputs.bucket == 'non-us' && steps.tokengate.outputs.proceed == 'true'
        run: node scripts/release/verify-scheduled-prerequisites.mjs --as-of=${{ steps.cfg.outputs.asof }}

      # US publication: open controls -> release (Catalog + derive/preflight + publish + read-back) -> rebuild
      # membership -> ALWAYS safe-close.
      - name: Open publication controls (us run only)
        if: steps.cfg.outputs.bucket == 'us' && steps.tokengate.outputs.proceed == 'true'
        run: node scripts/release/priority-control-package.mjs --apply

      - name: Refresh Catalog + derive/preflight + publish all 30x3 + live read-back (us run only)
        if: steps.cfg.outputs.bucket == 'us' && steps.tokengate.outputs.proceed == 'true'
        run: node scripts/release/priority-dashboards-release.mjs --as-of=${{ steps.cfg.outputs.asof }} --operation-key=priority-dashboards/scheduled/${{ steps.cfg.outputs.asof }}

      - name: Rebuild + verify Brand View membership from the fresh brand-sales (us run only; Supabase-only)
        if: steps.cfg.outputs.bucket == 'us' && steps.tokengate.outputs.proceed == 'true'
        run: node scripts/release/rebuild-brand-membership.mjs

      - name: Safe-close publication controls (ALWAYS, us run only, idempotent)
        if: always() && steps.cfg.outputs.bucket == 'us'
        run: node scripts/release/priority-control-package.mjs --rollback

      - name: Report insufficient-tokens skip
        if: always() && steps.tokengate.outputs.proceed != 'true' && steps.tokengate.outcome == 'success'
        run: echo "SKIPPED_INSUFFICIENT_TOKENS -- no creates, no controls, LKG unchanged (bucket=${{ steps.cfg.outputs.bucket }} asOf=${{ steps.cfg.outputs.asof }})."

name: scheduler-recovery

# GitHub-NATIVE trigger-recovery backstop for scheduler-v2. It is NOT a second scheduler and runs ZERO report work:
# it only inspects scheduler-v2's own workflow runs via the GitHub REST API and, when a region's PRIMARY cron
# produced NO run for the day (past a 20-minute grace, within a bounded 3-hour window), dispatches ONE scheduler-v2
# run with dispatch_id `recovery/<region>/<business-date>`. It exists because GitHub's scheduled-cron delivery is
# best-effort: on 2026-09-10 the india 03:00 primary produced no run at all (it did not start, so it did not
# "fail"), and the Cloudflare recovery poller also produced no invocation.
#
# DIVISION OF LABOUR: Cloudflare owns the FREQUENT recovery (one global */10 poller, 20-min grace, 3h bounded
# per-region windows, dispatching cloudflare/<region>/<D-1>). This GitHub workflow is the LOW-COST INDEPENDENT FINAL
# backstop: exactly THREE scheduled runs per day -- one per region, 40 minutes after that region's primary, so each
# check lands inside the region's [primary+20m, primary+180m] recovery window:
#   - india     47 3  * * *  (03:47 UTC / 09:17 IST)  -- primary 03:07 + 40m
#   - europe-au 17 9  * * *  (09:17 UTC / 14:47 IST)  -- primary 08:37 + 40m
#   - us-ca     17 17 * * *  (17:17 UTC / 22:47 IST)  -- primary 16:37 + 40m
# Each cron maps DETERMINISTICALLY to exactly one region (resolved from github.event.schedule via the pure module,
# never the wall clock). Target cost: 3 recovery jobs/day (not 144).
#
# WHY IT CANNOT CAUSE DUPLICATE PAID WORK: a recovery dispatch, the missed primary (if it later arrives late), and
# the Cloudflare recovery dispatch ALL converge on ONE durable cycle identity -- opkey
# `scheduled-fresh/<region>/<D-1>`, computed inside the dispatched run from the clock, never from the cron or
# dispatch_id. scheduler-v2's per-region concurrency group serializes same-region runs, its read-only duplicate
# guard makes an already-published D-1 a zero-write no-op, and its token/create budget + leases are keyed to that
# one cycle. This workflow additionally treats a Cloudflare recovery run (cloudflare/<region>/<D-1> OR
# external/<region>/<D-1>) or a prior GitHub recovery run as an EXISTING run, so it never double-dispatches once
# either is visible, and it NEVER retries a run that started and failed.
#
# COST: 3 runs/day. Each is deliberately lightweight (checkout + setup-node + a pure Node script; NO npm ci, NO
# DataDoe, NO DB), typically finishing in seconds. DataDoe tokens = 0 structurally.

on:
  schedule:
    - cron: "47 3 * * *"   # india     recovery -- 03:47 UTC (primary 03:07 + 40m)
    - cron: "17 9 * * *"   # europe-au recovery -- 09:17 UTC (primary 08:37 + 40m)
    - cron: "17 17 * * *"  # us-ca     recovery -- 17:17 UTC (primary 16:37 + 40m)
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (default: decide + log only, never dispatch) | live (explicitly dispatch a missed region)"
        required: false
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - live

concurrency:
  # One recovery pass at a time; the three daily crons never overlap, and an overlapping/delayed tick queues rather
  # than races. Decisions are idempotent (a prior recovery / Cloudflare run is observed as EXISTING), so a queued
  # duplicate is a zero-dispatch no-op.
  group: scheduler-recovery
  cancel-in-progress: false

permissions:
  # Minimum for this backstop: read the repo (checkout) + inspect AND dispatch scheduler-v2. actions:write is the
  # least Actions permission that can BOTH list runs and POST a workflow_dispatch; no PAT and no new secret are used.
  contents: read
  actions: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: sales-dashboard-live
    env:
      # Provided by the Actions runtime (actions:write). Used ONLY to read scheduler-v2 runs + POST one dispatch.
      # Never printed. No DataDoe/Supabase/Postgres secret is referenced -- this workflow performs no report work.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # No `npm ci`: the recovery script imports only the pure decision module + uses the Node 24 global fetch, so
      # it has zero third-party dependencies. Keeping the run dependency-free is what keeps this backstop cheap.
      # --schedule is the fired recovery cron (empty on a manual dispatch => the script evaluates all regions). A
      # scheduled run is ALWAYS live; a manual workflow_dispatch defaults to dry-run and must opt in to live.
      - name: Recover any missed scheduler-v2 regional trigger (inspect runs; dispatch only a truly-missed cron)
        run: node scripts/release/scheduler-recovery.mjs --mode=${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }} --schedule="${{ github.event.schedule }}"

name: oli-publication-reconcile

# ZERO-EXPORT OLI publication reconciler (WORK 7). Every 30 minutes it re-derives + promotes the OLI-dependent
# canonical live dashboards (daily-reporting / brand-sales / brand-inventory) for accounts whose ALREADY-SAVED durable
# OLI advanced past -- or was never promoted to -- their live snapshots. It is the durable safety net for the promotion
# stranding the scheduler's per-bucket, operator-CLI-only publication leaves behind. It is NOT a second scheduler and
# NEVER creates a DataDoe export, reserves a token, refreshes a source, or supersedes the daily export -- the
# reconciler's derive adapter is forced to refuse creates (zero export, structurally).
#
# PERIODIC CONTROL LIFECYCLE: each region runs the reviewed control-package transaction -- apply (open the publication
# controls for EXACTLY the stale accounts + acquire the control-plane lease + capture the generation) -> publish into
# the reviewed priority-partial-<region>-<16hex> cycle namespace with that fence -> ALWAYS safe-close with the same
# owner/generation. The control-plane lease is GLOBAL, so regions run SEQUENTIALLY (never in parallel) -- each holds the
# lease only for its own apply/publish/safe-close window, so a busy region never blocks another for long.
#
# CAPACITY (blocker 6): ONE job (one checkout + one `npm ci`) loops the 3 regions in order, each wrapped in a 7-minute
# hard cap, so the whole pass finishes in <= ~22 min -- comfortably inside the 30-minute tick, no queued-run backlog.
# A per-region failure/timeout is isolated (the loop continues); region + account isolation and zero-export are kept.
#
# SAFETY POSTURE (default OFF for live promotion):
#   - MANUAL runs default to DRY-RUN (read-only plan; zero writes) and must opt in to live.
#   - SCHEDULED runs are DRY-RUN unless the repository variable OLI_RECONCILE_LIVE == 'true' is set deliberately (after
#     Codex review + a natural-run validation). Merging this workflow is safe -- it only reports the plan + proves
#     DataDoe creates/tokens = 0 until an operator enables live promotion.
#
# Required repository secrets (never printed): POSTGRES_URL, SUPABASE_URL (or VITE_SUPABASE_URL),
# SUPABASE_SERVICE_ROLE_KEY, DATADOE_API_KEY (+ DATADOE_API_KEY_SECONDARY if a secondary connection is configured).
# A delayed GitHub cron is acceptable here because this is recovery, not the primary export schedule.

on:
  schedule:
    # Every 30 minutes, OFFSET 13 minutes away from the exact hour/half-hour so it never lands on a scheduler boundary.
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (default: read-only plan, ZERO writes) | live (derive + promote stale OLI-dependent dashboards)"
        required: false
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - live
      bucket:
        description: "restrict to one region (india|europe-au|us-ca); blank = all three"
        required: false
        default: ""
        type: string

concurrency:
  # ONE reconcile pass at a time (the control-plane lease is global). A delayed/overlapping tick QUEUES rather than
  # races; the reconciler is idempotent (an already-current live snapshot is a zero-write no-op) so a queued duplicate
  # is harmless. The tight per-region cap keeps a pass well under 30 min so the queue never backs up.
  group: oli-publication-reconcile
  cancel-in-progress: false

permissions:
  # Least privilege: read the repo (checkout) only. All state changes go to the database via the control-plane lease
  # (not to GitHub), so no actions:write / no PAT / no extra token is used.
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    # ONE job for all regions (one checkout + one npm ci). 25 < 30-minute tick; the per-region `timeout` caps each.
    timeout-minutes: 25
    outputs:
      asof: ${{ steps.reconcile.outputs.asof }}
      only: ${{ steps.reconcile.outputs.only }}
      mode: ${{ steps.reconcile.outputs.mode }}
    defaults:
      run:
        working-directory: sales-dashboard-live
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATADOE_API_KEY: ${{ secrets.DATADOE_API_KEY }}
      DATADOE_API_KEY_SECONDARY: ${{ secrets.DATADOE_API_KEY_SECONDARY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify required secrets are present (fail closed; never print values)
        run: |
          missing=""
          for v in POSTGRES_URL SUPABASE_SERVICE_ROLE_KEY DATADOE_API_KEY; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -z "${SUPABASE_URL:-}" ] && [ -z "${VITE_SUPABASE_URL:-}" ]; then missing="$missing SUPABASE_URL|VITE_SUPABASE_URL"; fi
          if [ -n "$missing" ]; then echo "STOP missing required secret(s):$missing"; exit 1; fi
      - name: Install dependencies
        run: npm ci
      # DRY-RUN unless a manual dispatch selected 'live' OR the repository variable OLI_RECONCILE_LIVE=='true'. --as-of is
      # yesterday UTC (a conservative D-1 target); an account whose durable OLI does not prove through it is deferred
      # (keeps LKG) and picked up by the next natural scheduler run. ZERO DataDoe creates/tokens either way. Each region
      # is a SEPARATE, sequential invocation (its own control-package apply/publish/safe-close) capped at 7 minutes so
      # one region can never consume the whole budget; the loop continues on a per-region failure (isolation).
      - name: Reconcile OLI-dependent live dashboards, all regions in order (zero export)
        id: reconcile
        run: |
          MODE='${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || (vars.OLI_RECONCILE_LIVE == 'true' && 'live' || 'dry-run') }}'
          ONLY='${{ github.event.inputs.bucket }}'
          ASOF="$(date -u -d 'yesterday' +%F)"
          echo "asof=$ASOF" >> "$GITHUB_OUTPUT"; echo "only=$ONLY" >> "$GITHUB_OUTPUT"; echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          LIVE=""; if [ "$MODE" = "live" ]; then LIVE="--live"; fi
          rc=0
          for REGION in india europe-au us-ca; do
            if [ -n "$ONLY" ] && [ "$ONLY" != "$REGION" ]; then echo "skip $REGION (dispatch restricted to $ONLY)"; continue; fi
            echo "::group::oli-reconcile $REGION mode=$MODE as-of=$ASOF"
            # --deadline-seconds=330 makes the reconciler stop new accounts + bound the in-flight one + safe-close BEFORE
            # the 420s hard kill (cooperative reserve). The SEPARATE always() cleanup job below reclaims + proves the
            # control plane closed if a region was still hard-killed (a step here would be killed with the job).
            timeout 420 node scripts/release/oli-publication-reconcile.mjs --bucket="$REGION" --as-of="$ASOF" --mode=periodic --deadline-seconds=330 $LIVE || { echo "region $REGION reconcile exited nonzero (isolated; continuing)"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc

  # ABNORMAL-TERMINATION CLEANUP (blocker 5): a SEPARATE job (`needs: reconcile`, `if: always()`) so it survives the
  # reconcile job's timeout / cancellation -- a same-job step would be killed with it. It PROVES (read-only) each live
  # region's priority control plane is closed and RECLAIMS only a free/expired plane (a live owner is left untouched).
  # The job -- and therefore the workflow -- is NON-GREEN when any region's control plane cannot be proven closed, so an
  # unresolved open control plane can never be reported as success. Exact owner/generation fencing is preserved (the
  # reclaim acquires its own generation only on a free/expired lease).
  cleanup:
    needs: reconcile
    # Gate on the SAME effective-mode==live decision the reconcile step computes (recomputed here, not read from
    # reconcile's outputs, so cleanup still runs if the reconcile job was hard-cancelled and its outputs never
    # propagated). always() -> runs after reconcile regardless of its outcome. MUST match the reconcile MODE expression
    # EXACTLY (defect 2): a MANUAL dry-run is zero-write and its cleanup must NOT run EVEN IF vars.OLI_RECONCILE_LIVE is
    # 'true' -- the repo flag only decides SCHEDULED runs. Effective live iff: (manual dispatch AND inputs.mode==live) OR
    # (NOT a manual dispatch AND the repo flag is 'true').
    if: always() && ((github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'live') || (github.event_name != 'workflow_dispatch' && vars.OLI_RECONCILE_LIVE == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sales-dashboard-live
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATADOE_API_KEY: ${{ secrets.DATADOE_API_KEY }}
      DATADOE_API_KEY_SECONDARY: ${{ secrets.DATADOE_API_KEY_SECONDARY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Verify each live region's control plane is proven closed (reclaim only a free/expired plane)
        run: |
          ASOF='${{ needs.reconcile.outputs.asof }}'; ONLY='${{ needs.reconcile.outputs.only }}'
          if [ -z "$ASOF" ]; then ASOF="$(date -u -d 'yesterday' +%F)"; fi
          rc=0
          for REGION in india europe-au us-ca; do
            if [ -n "$ONLY" ] && [ "$ONLY" != "$REGION" ]; then continue; fi
            echo "::group::oli-reconcile cleanup $REGION as-of=$ASOF"
            node scripts/release/oli-publication-reconcile.mjs --bucket="$REGION" --as-of="$ASOF" --mode=periodic --cleanup || { echo "region $REGION control cleanup UNVERIFIED"; rc=1; }
            echo "::endgroup::"
          done
          if [ "$rc" != "0" ]; then echo "STOP OLI_RECONCILE_CLEANUP_UNVERIFIED: one or more regions' control plane could not be proven closed."; fi
          exit $rc

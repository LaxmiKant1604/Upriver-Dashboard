name: oli-publication-reconcile

# ZERO-EXPORT OLI publication reconciler (WORK 7). Every 30 minutes it re-derives + promotes the OLI-dependent
# canonical live dashboards (daily-reporting / brand-sales / brand-inventory) for accounts whose ALREADY-SAVED durable
# OLI advanced past -- or was never promoted to -- their live snapshots. It is the durable safety net for the promotion
# stranding the scheduler's per-bucket, operator-CLI-only publication leaves behind (a validated shadow that never
# reached the bare live key, or a healthy account blocked by a sibling's un-validated shadow in an all-or-nothing
# finalize). It is NOT a second scheduler and NEVER creates a DataDoe export, reserves a token, refreshes a source, or
# supersedes the daily export -- the reconciler's derive adapter is forced to refuse creates (zero export, structurally).
#
# SAFETY POSTURE (default OFF for live promotion):
#   - MANUAL runs (workflow_dispatch) default to DRY-RUN (read-only plan; zero writes) and must opt in to live.
#   - SCHEDULED runs are DRY-RUN unless the repository variable OLI_RECONCILE_LIVE == 'true' is set deliberately
#     (after Codex review + a natural-run validation). So merging this workflow is safe -- it only reports the plan and
#     proves DataDoe creates/tokens = 0 until an operator explicitly enables live promotion.
#   - It ACQUIRES the SAME control-plane lease the scheduler publishes under and DEFERS (never steals) when another
#     owner holds it, so it can never race or supersede an in-flight daily publish. Region work is isolated (a matrix
#     with bounded concurrency) and each region has its own concurrency group.
#
# Required repository secrets (never printed): POSTGRES_URL, SUPABASE_URL (or VITE_SUPABASE_URL),
# SUPABASE_SERVICE_ROLE_KEY, DATADOE_API_KEY (+ DATADOE_API_KEY_SECONDARY if a secondary connection is configured).
# A delayed GitHub cron is acceptable here because this is recovery, not the primary export schedule.

on:
  schedule:
    # Every 30 minutes, OFFSET 13 minutes away from the exact hour/half-hour so it never lands on a scheduler boundary.
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (default: read-only plan, ZERO writes) | live (derive + promote stale OLI-dependent dashboards)"
        required: false
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - live
      bucket:
        description: "restrict to one region (india|europe-au|us-ca); blank = all three"
        required: false
        default: ""
        type: string

concurrency:
  # One reconcile pass per region at a time; a delayed/overlapping tick queues rather than races. The reconciler is
  # idempotent (an already-current live snapshot is a zero-write no-op) so a queued duplicate is harmless.
  group: oli-publication-reconcile-${{ github.event.inputs.bucket || 'all' }}
  cancel-in-progress: false

permissions:
  # Least privilege: read the repo (checkout) only. All state changes go to the database via the control-plane lease
  # (not to GitHub), so no actions:write / no PAT / no extra token is used.
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Region isolation with bounded concurrency: one region at a time (max-parallel 1), each in its own bucket.
      # fail-fast:false so one region's failure never cancels the others.
      fail-fast: false
      max-parallel: 1
      matrix:
        bucket: ["india", "europe-au", "us-ca"]
    defaults:
      run:
        working-directory: sales-dashboard-live
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATADOE_API_KEY: ${{ secrets.DATADOE_API_KEY }}
      DATADOE_API_KEY_SECONDARY: ${{ secrets.DATADOE_API_KEY_SECONDARY }}
    steps:
      # Skip regions not selected by a manual single-region dispatch.
      - name: Resolve whether this region runs
        id: gate
        run: |
          want='${{ github.event.inputs.bucket }}'
          if [ -n "$want" ] && [ "$want" != '${{ matrix.bucket }}' ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "region ${{ matrix.bucket }} skipped (dispatch restricted to $want)"; exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "24"
      - name: Verify required secrets are present (fail closed; never print values)
        if: steps.gate.outputs.run == 'true'
        run: |
          missing=""
          for v in POSTGRES_URL SUPABASE_SERVICE_ROLE_KEY DATADOE_API_KEY; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -z "${SUPABASE_URL:-}" ] && [ -z "${VITE_SUPABASE_URL:-}" ]; then missing="$missing SUPABASE_URL|VITE_SUPABASE_URL"; fi
          if [ -n "$missing" ]; then echo "STOP missing required secret(s):$missing"; exit 1; fi
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci
      # DRY-RUN unless a manual dispatch selected 'live' OR the repository variable OLI_RECONCILE_LIVE=='true' is set.
      # --as-of is yesterday UTC (a conservative D-1 target); an account whose durable OLI does not prove through it is
      # deferred (keeps LKG) and picked up by the next natural scheduler run. ZERO DataDoe creates/tokens either way.
      - name: Reconcile OLI-dependent live dashboards (zero export)
        if: steps.gate.outputs.run == 'true'
        run: |
          MODE='${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || (vars.OLI_RECONCILE_LIVE == 'true' && 'live' || 'dry-run') }}'
          ASOF="$(date -u -d 'yesterday' +%F)"
          echo "oli-reconcile ${{ matrix.bucket }} mode=$MODE as-of=$ASOF"
          if [ "$MODE" = "live" ]; then
            node scripts/release/oli-publication-reconcile.mjs --bucket=${{ matrix.bucket }} --as-of="$ASOF" --mode=periodic --live
          else
            node scripts/release/oli-publication-reconcile.mjs --bucket=${{ matrix.bucket }} --as-of="$ASOF" --mode=periodic
          fi

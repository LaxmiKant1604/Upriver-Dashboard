name: manual-lhv3-paid-acceptance
run-name: manual-lhv3-paid-acceptance ${{ inputs.region }}/${{ inputs.cycle_date }}

# TEMPORARY BRANCH-ONLY acceptance operator. This runs only the existing Listing
# Health v3 ingestion composition: paid Listings + Listings Raw exports, with
# inventory reuse-only. It does not run the regional scheduler or another source
# family. The release script retains its authorization, balance-reserve, frozen-
# budget, idempotency, and exact-confirmation gates.

on:
  workflow_dispatch:
    inputs:
      region:
        description: "One region only"
        required: true
        type: choice
        options:
          - india
          - europe-au
          - us-ca
      cycle_date:
        description: "Exact UTC cycle date (YYYY-MM-DD)"
        required: true
        type: string
      confirm:
        description: "Must equal listing-health-v3/<region>/<cycle_date>"
        required: true
        type: string

concurrency:
  group: manual-lhv3-paid-acceptance-${{ inputs.region }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: sales-dashboard-live
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATADOE_API_KEY: ${{ secrets.DATADOE_API_KEY }}
      DATADOE_API_KEY_SECONDARY: ${{ secrets.DATADOE_API_KEY_SECONDARY }}
      PRIORITY_OPERATOR: laxmikant@superboring.in
      LISTING_HEALTH_V3_INGESTION_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate exact paid-operation confirmation
        shell: bash
        run: |
          set -euo pipefail
          REGION='${{ inputs.region }}'
          CYCLE='${{ inputs.cycle_date }}'
          CONFIRM='${{ inputs.confirm }}'
          [[ "$CYCLE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Invalid cycle_date" >&2; exit 1; }
          EXPECTED="listing-health-v3/$REGION/$CYCLE"
          [ "$CONFIRM" = "$EXPECTED" ] || { echo "Confirmation mismatch" >&2; exit 1; }
          missing=""
          for v in POSTGRES_URL SUPABASE_SERVICE_ROLE_KEY DATADOE_API_KEY; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -z "${SUPABASE_URL:-}" ] && [ -z "${VITE_SUPABASE_URL:-}" ]; then missing="$missing SUPABASE_URL|VITE_SUPABASE_URL"; fi
          [ -z "$missing" ] || { echo "Missing required secret(s):$missing" >&2; exit 1; }
      - name: Install dependencies
        run: npm ci
      - name: Verify isolated acceptance-cycle wiring
        run: npm run test:listing-health-v3-ingestion
      - name: Run paid Listings and Listings Raw ingestion only
        shell: bash
        run: |
          ACCEPTANCE_SUFFIX="$(printf '%016x' "$GITHUB_RUN_ID")"
          node scripts/release/listing-health-v3-ingestion.mjs --region=${{ inputs.region }} --mode=live --cycle-date=${{ inputs.cycle_date }} --confirm=${{ inputs.confirm }} --cycle-bucket-suffix="$ACCEPTANCE_SUFFIX"

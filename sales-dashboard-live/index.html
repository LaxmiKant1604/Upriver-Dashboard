<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#16054E" />
    <title>UPRIVER — Amazon Seller Analytics</title>
    <!--
      The workspace typefaces. These load from a <link> rather than a CSS
      @import inside the injected stylesheet so the browser can start fetching
      them during HTML parsing instead of after the stylesheet is evaluated.
      Outfit carries headings and figures; Plus Jakarta Sans is the body face.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
